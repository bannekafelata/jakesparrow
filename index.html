function drawCloud(x,y,sc){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc*.6);
  ctx.fillStyle='rgba(200,210,240,.12)';
  [[-40,0,35],[-15,-10,45],[20,-5,38],[55,0,30]].forEach(([cx,cy,r])=>{
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();});
  ctx.restore();
}
function drawPalm(x,y,sc){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.strokeStyle='#3d2200';ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(5,-50,-10,-100,0,-140);ctx.stroke();
  ctx.fillStyle='#1a5c1a';
  [-0.3,0.3,0.8,-0.8,1.2,-1.2,Math.PI].forEach(a=>{
    ctx.save();ctx.translate(0,-140);ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(20,-10,50,-5,65,10);ctx.bezierCurveTo(40,5,15,5,0,0);ctx.fill();
    ctx.restore();});
  ctx.restore();
}
function drawBarrel(x,y){
  ctx.fillStyle='#3d2200';ctx.beginPath();ctx.ellipse(x,y,20,28,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#1a0d00';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='#6b3a00';ctx.lineWidth=3;
  [-12,0,12].forEach(dy=>{ctx.beginPath();ctx.ellipse(x,y+dy,20,6,0,0,Math.PI*2);ctx.stroke();});
}
function drawBackground(bgId){
  const t=Date.now()*.001;
  if(bgId===0){// Pearl
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0520');g.addColorStop(.6,'#1a0a40');g.addColorStop(1,'#0d1530');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const mx=W*.75-(camX*.05)%W;
    ctx.fillStyle='#ffffcc';ctx.shadowColor='#ffffaa';ctx.shadowBlur=30;
    ctx.beginPath();ctx.arc(mx,80,40,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#d0d0a0';ctx.beginPath();ctx.arc(mx+8,72,32,0,Math.PI*2);ctx.fill();
    for(let i=0;i<60;i++){const sx=((i*137.5+(camX*.02))%W+W)%W,sy=(i*53.3)%(H*.6);
      ctx.fillStyle=`rgba(255,255,220,${.4+.6*Math.abs(Math.sin(t+i))})`;ctx.fillRect(sx,sy,1.5,1.5);}
    for(let c=0;c<5;c++){const cx=((c*800+camX*.15+t*80)%(W+300)+W+300)%(W+300)-150;drawCloud(cx,80+c*30,.6+c*.1);}
    const sy=H*.82,sg=ctx.createLinearGradient(0,sy,0,H);sg.addColorStop(0,'#0a2040');sg.addColorStop(1,'#051020');
    ctx.fillStyle=sg;ctx.fillRect(0,sy,W,H-sy);
    ctx.strokeStyle='rgba(100,150,255,.22)';ctx.lineWidth=2;
    for(let w=0;w<3;w++){ctx.beginPath();for(let x=0;x<=W;x+=20){const wy=sy+w*8+Math.sin(x*.02+t*2+w)*5;x===0?ctx.moveTo(x,wy):ctx.lineTo(x,wy);}ctx.stroke();}
  } else if(bgId===1){// Hold
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05030e');g.addColorStop(1,'#0a0520');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#1a0d05';ctx.lineWidth=3;
    for(let x=0;x<W;x+=40){const px=((x-camX*.3)%W+W)%W;ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke();}
    for(let l=0;l<6;l++){
      const lx=((l*400-camX*.4)%(W+200)+W+200)%(W+200)-100,ly=60+Math.sin(t*2+l)*8,fl=.7+.3*Math.sin(t*3.7+l*1.3);
      ctx.fillStyle=`rgba(255,180,50,${fl*.6})`;ctx.shadowColor='#ff8800';ctx.shadowBlur=30*fl;
      ctx.beginPath();ctx.moveTo(lx,ly-15);ctx.lineTo(lx-10,ly+20);ctx.lineTo(lx+10,ly+20);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(lx,ly-15);ctx.lineTo(lx,0);ctx.stroke();
    }
    for(let b=0;b<8;b++){const bx=((b*350+60-camX*.5)%(W+100)+W+100)%(W+100)-50;drawBarrel(bx,H-100);}
  } else if(bgId===2||bgId===3){// Island / Fortress
    const g=ctx.createLinearGradient(0,0,0,H);
    if(bgId===2){g.addColorStop(0,'#020810');g.addColorStop(.5,'#0a1a30');g.addColorStop(1,'#1a2040');}
    else{g.addColorStop(0,'#080210');g.addColorStop(.5,'#1a0820');g.addColorStop(1,'#0a0818');}
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const mx=W*.3-(camX*.03)%(W*.5);
    ctx.fillStyle=bgId===2?'#fff5cc':'#ddc8ff';ctx.shadowColor=bgId===2?'#ffffaa':'#cc88ff';ctx.shadowBlur=40;
    ctx.beginPath();ctx.arc(mx,70,45,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    for(let s=0;s<80;s++){const sx=((s*113+camX*.015)%W+W)%W,sy=(s*47)%(H*.55);
      ctx.fillStyle='rgba(255,255,200,.3)';ctx.fillRect(sx,sy,1,1);}
    for(let c=0;c<4;c++){const cx=((c*700+camX*.1+t*60)%(W+200)+W+200)%(W+200)-100;drawCloud(cx,100+c*25,.5+c*.12);}
    for(let p=0;p<6;p++){const px=((p*450-camX*.35)%(W+200)+W+200)%(W+200)-100;
      if(bgId===2)drawPalm(px,H*.82,.55);
      else{// Fortress : tours de château
        ctx.fillStyle='#2a1a30';ctx.fillRect(px-15,H*.6-60,30,80);
        ctx.fillStyle='#1a0d20';for(let m=-1;m<=1;m++)ctx.fillRect(px+m*10-4,H*.6-80,8,20);
      }
    }
    const sy=H*.88,sg=ctx.createLinearGradient(0,sy,0,H);sg.addColorStop(0,'#0a2a50');sg.addColorStop(1,'#040e20');
    ctx.fillStyle=sg;ctx.fillRect(0,sy,W,H-sy);
    ctx.strokeStyle='rgba(100,180,255,.18)';ctx.lineWidth=2;
    for(let w=0;w<3;w++){ctx.beginPath();for(let x=0;x<=W;x+=15){const wy=sy+w*7+Math.sin(x*.025+t*1.5+w)*6;x===0?ctx.moveTo(x,wy):ctx.lineTo(x,wy);}ctx.stroke();}
  } else if(bgId===4){// Tortuga — taverne chaude et colorée, coucher de soleil
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a0508');g.addColorStop(.3,'#3a1008');g.addColorStop(.6,'#5a2010');g.addColorStop(1,'#2a0e08');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Soleil couchant orange
    const sunX=W*.7-(camX*.04)%200;
    const sunGrad=ctx.createRadialGradient(sunX,H*.35,0,sunX,H*.35,120);
    sunGrad.addColorStop(0,'rgba(255,200,80,.9)');sunGrad.addColorStop(.4,'rgba(255,100,20,.5)');sunGrad.addColorStop(1,'rgba(255,50,0,0)');
    ctx.fillStyle=sunGrad;ctx.fillRect(sunX-120,H*.35-120,240,240);
    // Nuages orangés
    ctx.fillStyle='rgba(200,80,20,.25)';
    for(let c=0;c<6;c++){const cx=((c*580+camX*.12+t*50)%(W+300)+W+300)%(W+300)-150;
      ctx.beginPath();ctx.ellipse(cx,80+c*18,70+c*10,25,0,0,Math.PI*2);ctx.fill();}
    // Bâtiments de Tortuga en silhouette
    ctx.fillStyle='#0d0508';
    const bldX=[-camX*.2%W,(400-camX*.2)%W,(800-camX*.2)%W,(1200-camX*.2)%W];
    bldX.forEach((bx,i)=>{
      const bw=90+i*20,bh=120+i*30;
      ctx.fillRect(((bx%W+W)%W)-20,H-bh,bw,bh);
      // Fenêtres allumées
      ctx.fillStyle=`rgba(255,${160+i*20},40,.7)`;
      for(let r=0;r<3;r++)for(let cc=0;cc<3;cc++)
        ctx.fillRect(((bx%W+W)%W)+5+cc*25,H-bh+15+r*28,12,16);
      ctx.fillStyle='#0d0508';
    });
    // Sol taverne brun chaud
    const floorY=H*.84;
    const flGrad=ctx.createLinearGradient(0,floorY,0,H);
    flGrad.addColorStop(0,'#3a1a08');flGrad.addColorStop(1,'#1a0808');
    ctx.fillStyle=flGrad;ctx.fillRect(0,floorY,W,H-floorY);
    // Planches
    ctx.strokeStyle='rgba(80,30,8,.5)';ctx.lineWidth=2;
    for(let fx=0;fx<W;fx+=50){ctx.beginPath();ctx.moveTo(fx,floorY);ctx.lineTo(fx,H);ctx.stroke();}
    // Torches animées
    for(let torch=0;torch<5;torch++){
      const tx=((torch*220-camX*.3)%(W+100)+W+100)%(W+100)-50,ty=H*.55;
      const fl2=.6+.4*Math.sin(t*4+torch*1.7);
      ctx.fillStyle=`rgba(255,${Math.floor(150+fl2*80)},20,${fl2*.8})`;
      ctx.shadowColor='#ff6600';ctx.shadowBlur=20*fl2;
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(tx-8,ty-20,tx,ty-30);ctx.quadraticCurveTo(tx+8,ty-20,tx,ty);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#4a2a00';ctx.fillRect(tx-3,ty,6,20);// manche torche
    }
  } else if(bgId===5){// Mer des Caraïbes — aube/tempête épique
    // Ciel tempétueux
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#020408');g.addColorStop(.3,'#050818');g.addColorStop(.6,'#0a1228');g.addColorStop(1,'#040808');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Éclairs lointains
    if(Math.floor(t*3)%60===0){
      ctx.strokeStyle='rgba(180,200,255,.6)';ctx.lineWidth=2;
      const lx=W*.3+Math.random()*W*.4;
      ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx+20,80);ctx.lineTo(lx+5,120);ctx.lineTo(lx+25,200);ctx.stroke();
    }
    // Nuages d'orage lourds
    ctx.fillStyle='rgba(30,30,50,.7)';
    for(let c=0;c<8;c++){
      const cx=((c*480+camX*.08+t*30)%(W+400)+W+400)%(W+400)-200;
      const cy=40+c*15;
      ctx.beginPath();ctx.ellipse(cx,cy,100+c*15,40,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx+60,cy-10,70,35,0,0,Math.PI*2);ctx.fill();
    }
    // Lune voilée
    const moonX=W*.2-(camX*.02)%100;
    ctx.fillStyle='rgba(200,220,255,.3)';ctx.shadowColor='#aabbff';ctx.shadowBlur=30;
    ctx.beginPath();ctx.arc(moonX,60,35,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // MER agitée — couches multiples
    for(let layer=0;layer<4;layer++){
      const seaY=H*.6+layer*20;
      const waveGrad=ctx.createLinearGradient(0,seaY,0,H);
      const dark=layer*.06;
      waveGrad.addColorStop(0,`rgba(${Math.floor(8+layer*10)},${Math.floor(30+layer*12)},${Math.floor(80+layer*15)},${.7+layer*.08})`);
      waveGrad.addColorStop(1,`rgba(2,8,20,1)`);
      ctx.fillStyle=waveGrad;
      ctx.beginPath();ctx.moveTo(0,seaY);
      for(let x=0;x<=W+20;x+=15){
        const wh=12-layer*2;
        const wy=seaY+Math.sin(x*.025+t*(2.5-layer*.4)+layer)*wh+Math.sin(x*.04+t*1.8+layer*2)*wh*.5;
        ctx.lineTo(x,wy);
      }
      ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    }
    // Écume sur les vagues
    ctx.strokeStyle='rgba(180,210,255,.25)';ctx.lineWidth=1.5;
    for(let w=0;w<4;w++){
      ctx.beginPath();
      for(let x=0;x<=W;x+=8){
        const wy=H*.6+w*18+Math.sin(x*.03+t*3+w)*8;
        x===0?ctx.moveTo(x,wy):ctx.lineTo(x,wy);
      }
      ctx.stroke();
    }
    // Silhouette Black Pearl en fond (parallaxe lente)
    const shipX=W*.6-(camX*.06)%(W*.8);
    ctx.save();ctx.translate(shipX,H*.55);ctx.fillStyle='rgba(0,0,0,.6)';
    // Coque
    ctx.beginPath();ctx.moveTo(-80,20);ctx.lineTo(80,20);ctx.lineTo(90,40);ctx.lineTo(-90,40);ctx.closePath();ctx.fill();
    // Mâts
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=3;
    [-20,10,40].forEach(mx2=>{ctx.beginPath();ctx.moveTo(mx2,20);ctx.lineTo(mx2,-80);ctx.stroke();});
    // Voiles
    ctx.fillStyle='rgba(20,10,5,.5)';
    ctx.beginPath();ctx.moveTo(-20,-80);ctx.lineTo(30,-80);ctx.lineTo(30,-20);ctx.lineTo(-20,-20);ctx.fill();
    ctx.beginPath();ctx.moveTo(10,-80);ctx.lineTo(50,-80);ctx.lineTo(50,-30);ctx.lineTo(10,-30);ctx.fill();
    ctx.restore();
    // Rochers émergeant
    for(let r=0;r<5;r++){
      const rx=((r*400+180-camX*.4)%(W+200)+W+200)%(W+200)-100;
      ctx.fillStyle='#1a1a24';
      ctx.beginPath();ctx.ellipse(rx,H*.78,30+r*8,18+r*5,0,0,Math.PI*2);ctx.fill();
    }
  }
}

// ═══════════════════════════════════════════════════════════
// DESSIN PLATEFORMES
// ═══════════════════════════════════════════════════════════
function drawPlatform(p){
  const x=p.x-camX,y=p.y-camY;
  if(x+p.w<-20||x>W+20||y+p.h<-20||y>H+20)return;
  if(p.t==='wood'){
    const g=ctx.createLinearGradient(x,y,x,y+Math.min(p.h,20));
    g.addColorStop(0,'#8B5A2B');g.addColorStop(.5,'#6b3a15');g.addColorStop(1,'#4a2508');
    ctx.fillStyle=g;ctx.fillRect(x,y,p.w,p.h);
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
    for(let py=y;py<y+p.h;py+=14){ctx.beginPath();ctx.moveTo(x,py);ctx.lineTo(x+p.w,py);ctx.stroke();}
    ctx.fillStyle='#555';for(let nx=x+10;nx<x+p.w-10;nx+=40){ctx.beginPath();ctx.arc(nx,y+6,2,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle='#2a1200';ctx.lineWidth=2;ctx.strokeRect(x,y,p.w,Math.min(p.h,20));
  } else if(p.t==='crate'){
    ctx.fillStyle='#7a4a1a';ctx.fillRect(x,y,p.w,p.h);
    ctx.strokeStyle='#4a2508';ctx.lineWidth=2;ctx.strokeRect(x,y,p.w,p.h);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+p.w,y+p.h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+p.w,y);ctx.lineTo(x,y+p.h);ctx.stroke();
    [[x,y],[x+p.w-6,y],[x,y+p.h-6],[x+p.w-6,y+p.h-6]].forEach(([cx,cy])=>{ctx.fillStyle='#888';ctx.fillRect(cx,cy,6,6);});
  } else if(p.t==='chain'){
    const g=ctx.createLinearGradient(x,y,x,y+20);g.addColorStop(0,'#8B5A2B');g.addColorStop(1,'#4a2508');
    ctx.fillStyle=g;ctx.fillRect(x,y,p.w,p.h);
    ctx.strokeStyle='#777';ctx.lineWidth=2;
    [x+10,x+p.w-10].forEach(cx=>{ctx.beginPath();for(let cy=y;cy>y-80;cy-=8){ctx.moveTo(cx-2,cy);ctx.lineTo(cx+2,cy-8);}ctx.stroke();});
    ctx.strokeStyle='#2a1200';ctx.lineWidth=2;ctx.strokeRect(x,y,p.w,Math.min(p.h,20));
  } else if(p.t==='rock'){
    const g=ctx.createLinearGradient(x,y,x,y+p.h);g.addColorStop(0,'#6a6a7a');g.addColorStop(.4,'#4a4a5a');g.addColorStop(1,'#2a2a3a');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+5,y);ctx.lineTo(x+p.w-5,y);ctx.lineTo(x+p.w,y+p.h);ctx.lineTo(x,y+p.h);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#1a1a2a';ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+p.w*.3,y+3);ctx.lineTo(x+p.w*.4,y+p.h*.6);ctx.stroke();
  } else if(p.t==='sand'){
    const g=ctx.createLinearGradient(x,y,x,y+p.h);g.addColorStop(0,'#c8a060');g.addColorStop(.2,'#a07840');g.addColorStop(1,'#604820');
    ctx.fillStyle=g;ctx.fillRect(x,y,p.w,p.h);
    ctx.fillStyle='rgba(255,220,120,.28)';for(let i=0;i<p.w;i+=8)ctx.fillRect(x+i,y,3,2);
    ctx.strokeStyle='#7a5020';ctx.lineWidth=2;ctx.strokeRect(x,y,p.w,Math.min(p.h,15));
  } else if(p.t==='exit'){
    const g=ctx.createLinearGradient(x,y,x,y+20);g.addColorStop(0,'#8B5A2B');g.addColorStop(1,'#4a2508');
    ctx.fillStyle=g;ctx.fillRect(x,y,p.w,p.h);
    const tt=Date.now()*.003,glo=.5+.5*Math.sin(tt);
    ctx.fillStyle=`rgba(255,220,0,${glo*.4})`;ctx.shadowColor='#ffd700';ctx.shadowBlur=20*glo;
    ctx.beginPath();ctx.arc(x+p.w/2,y-20,18,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // Coffre
    const cx2=x+p.w/2-18,cy2=y-40;
    ctx.fillStyle='#5c2e00';ctx.fillRect(cx2,cy2,36,28);
    ctx.fillStyle='#c8930a';ctx.fillRect(cx2-2,cy2-6,40,10);ctx.fillRect(cx2,cy2+12,36,4);
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(cx2+18,cy2+14,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd700';ctx.font=`bold 10px 'Pirata One',serif`;ctx.textAlign='center';
    ctx.fillText('TRÉSOR',x+p.w/2,y+12);
  } else if(p.t==='spike'){
    ctx.fillStyle='#aaa';
    for(let sx=x;sx<x+p.w;sx+=12){ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(sx+6,y-16);ctx.lineTo(sx+12,y);ctx.closePath();ctx.fill();}
  }
}

// ═══════════════════════════════════════════════════════════
// DESSIN COLLECTIBLES
// ═══════════════════════════════════════════════════════════
function drawCollectibles(){
  const t=Date.now()*.004;
  for(const c of collectibles2){
    if(c.collected)continue;
    const cx=c.x-camX,cy=c.y-camY+Math.sin(t+c.x)*3;
    if(cx<-20||cx>W+20)continue;
    if(c.type==='coin'){
      ctx.fillStyle='#ffd700';ctx.shadowColor='#ffaa00';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffee88';ctx.beginPath();ctx.ellipse(cx-2,cy-2,3,4,-.4,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    } else if(c.type==='ammo'){
      ctx.fillStyle='#8B4513';ctx.fillRect(cx-8,cy-6,16,12);
      ctx.fillStyle='#c8930a';ctx.fillRect(cx-6,cy-4,3,8);ctx.fillRect(cx,cy-4,3,8);
      ctx.fillStyle='#888';ctx.beginPath();ctx.arc(cx+10,cy,4,0,Math.PI*2);ctx.fill();
    }
  }
}
function checkCollectibles(){
  let pts=0;
  for(const c of collectibles2){
    if(c.collected)continue;
    if(player2.x+player2.w>c.x-10&&player2.x<c.x+10&&player2.y+player2.h>c.y-10&&player2.y<c.y+10){
      c.collected=true;
      if(c.type==='coin'){sfx('coin');pts+=10;spawnParticles(c.x,c.y,'coin',8);}
      else if(c.type==='ammo'){sfx('coin');player2.ammo=Math.min(player2.maxAmmo,player2.ammo+3);}
    }
  }
  return pts;
}

// ═══════════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════════
function drawHeart(x,y,sz,full){
  ctx.fillStyle=full?'#e83030':'#333';
  if(full){ctx.shadowColor='#ff0000';ctx.shadowBlur=5;}
  ctx.beginPath();ctx.moveTo(x,y+sz*.35);
  ctx.bezierCurveTo(x,y,x-sz*.6,y,x-sz*.6,y+sz*.35);
  ctx.bezierCurveTo(x-sz*.6,y+sz*.65,x,y+sz,x,y+sz);
  ctx.bezierCurveTo(x,y+sz,x+sz*.6,y+sz*.65,x+sz*.6,y+sz*.35);
  ctx.bezierCurveTo(x+sz*.6,y,x,y,x,y+sz*.35);
  ctx.fill();ctx.shadowBlur=0;
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,40);
  for(let i=0;i<player2.maxHp;i++)drawHeart(14+i*26,8,12,i<player2.hp);
  ctx.fillStyle=player2.ammo>0?'#ffd700':'#ff4444';
  ctx.font='bold 13px "Courier New"';ctx.textAlign='left';
  ctx.fillText(`🔫 ${player2.ammo}/${player2.maxAmmo}`,160,26);
  ctx.fillStyle='#ffd700';ctx.textAlign='center';
  ctx.fillText(`⭐ ${score}`,W/2,26);
  ctx.fillStyle='#aaaaff';ctx.font='bold 10px "Courier New"';
  ctx.fillText((lvl?.name||'').toUpperCase(),W/2,14);
  // Niveau affiché
  ctx.fillStyle='#888';ctx.textAlign='right';ctx.font='10px "Courier New"';
  ctx.fillText(`Niveau ${lvlIdx+1}/${LEVELS.length}`,W-60,14);
  // Timer parental
  if(timerActive&&timerSecs>0){
    const mm=Math.floor(timerSecs/60),ss=timerSecs%60;
    ctx.fillStyle=timerSecs<60?'#ff4444':'#88ff88';
    ctx.font='bold 12px "Courier New"';ctx.textAlign='right';
    ctx.fillText(`⏱ ${mm}:${ss.toString().padStart(2,'0')}`,W-8,26);
  }
  // Icône mute
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='14px sans-serif';ctx.textAlign='right';
  ctx.fillText(muted?'🔇':'🔊',W-6,40);
}

// ═══════════════════════════════════════════════════════════
// GAMEPAD OVERLAY — uniquement sur PC tablette intermédiaire
// (sur mobile <700px la coque GBC DOM est utilisée)
// ═══════════════════════════════════════════════════════════
function drawGamepad(){
  // Sur mobile GBC on ne dessine rien sur le canvas
  if(window.innerWidth<=700||window.innerHeight<=520)return;
  // Sur tablette intermédiaire (700-900px) on garde le canvas overlay
  if(W>900&&H>600)return;
  const ps=Math.min(W,H)*.22,px=ps*.55,py=H-ps*.55;
  const br=ps*.18,ax=W-ps*.3,ay=H-ps*.55,bx2=W-ps*.7,by2=H-ps*.35;
  ctx.save();ctx.globalAlpha=.52;
  ctx.fillStyle='rgba(30,20,10,.7)';ctx.beginPath();ctx.arc(px,py,ps*.46,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(200,150,50,.5)';ctx.lineWidth=2;ctx.stroke();
  const aw=ps*.2,al=ps*.38;
  ctx.fillStyle='rgba(80,60,20,.85)';
  ctx.fillRect(px-al,py-aw/2,al*2,aw);ctx.fillRect(px-aw/2,py-al,aw,al*2);
  ctx.fillStyle='rgba(255,220,100,.8)';ctx.font=`${ps*.17}px sans-serif`;ctx.textAlign='center';
  ctx.fillText('▲',px,py-al*.5+5);ctx.fillText('▼',px,py+al*.65+5);
  ctx.fillText('◄',px-al*.55,py+5);ctx.fillText('►',px+al*.45,py+5);
  ctx.fillStyle='rgba(0,170,70,.8)';ctx.strokeStyle='rgba(80,255,130,.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(ax,ay,br*1.2,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='white';ctx.font=`bold ${br*.9}px sans-serif`;ctx.fillText('A',ax,ay+br*.32);
  ctx.fillStyle='rgba(190,30,30,.78)';ctx.strokeStyle='rgba(255,100,100,.6)';
  ctx.beginPath();ctx.arc(bx2,by2,br,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='white';ctx.font=`bold ${br*.8}px sans-serif`;ctx.fillText('B',bx2,by2+br*.3);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// ÉCRAN TITRE
// ═══════════════════════════════════════════════════════════
function drawTitle(){
  const t=Date.now()*.002;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05021a');g.addColorStop(1,'#0a1a30');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<90;i++){const sx=(i*113+7)%W,sy=(i*47+13)%(H*.55);
    ctx.fillStyle=`rgba(255,255,200,${.25+.5*Math.abs(Math.sin(t+i))})`;ctx.fillRect(sx,sy,1.5,1.5);}
  // Titre
  ctx.save();ctx.translate(W/2,H*.23);const sc=1+Math.sin(t*1.2)*.011;ctx.scale(sc,sc);
  ctx.fillStyle='#ffd700';ctx.shadowColor='#c8930a';ctx.shadowBlur=28;
  ctx.font=`bold ${Math.min(62,W/13)}px 'Pirata One',serif`;ctx.textAlign='center';
  ctx.fillText('JACK SPARROW',0,0);
  ctx.fillStyle='#ffeeaa';ctx.shadowColor='#aaaaff';ctx.shadowBlur=18;
  ctx.font=`bold ${Math.min(36,W/22)}px 'Pirata One',serif`;ctx.fillText('BLACK PEARL',0,48);
  ctx.shadowBlur=0;ctx.fillStyle='#9999cc';ctx.font=`${Math.min(13,W/60)}px "Courier New"`;
  ctx.fillText(`${LEVELS.length} Niveaux — Multi-Boss — Contrôle parental`,0,76);
  ctx.restore();

  // Mini Jack animé
  ctx.save();ctx.translate(W/2,H*.6+Math.sin(t)*7);ctx.scale(1.8,1.8);
  drawJack(ctx,'idle',Math.floor(t*2),1);ctx.restore();

  // Bouton JOUER
  const bw=200,bh=50,bx3=W/2-bw/2,by3=H*.76;
  const pu=.7+.3*Math.sin(t*2.2);
  ctx.fillStyle=`rgba(200,100,0,${pu})`;ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(bx3,by3,bw,bh,12);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffd700';ctx.font=`bold ${Math.min(22,W/37)}px 'Pirata One',serif`;ctx.textAlign='center';
  ctx.fillText('⚓ JOUER',W/2,by3+32);
  titleBtn={x:bx3,y:by3,w:bw,h:bh};

  // Contrôles
  ctx.fillStyle='rgba(255,255,200,.5)';ctx.font=`${Math.min(11,W/80)}px "Courier New"`;
  ctx.fillText('ZQSD/Flèches: bouger   Espace/Z: sauter   E: épée   P: pistolet',W/2,H*.9);
  ctx.fillText('Double saut possible !   R: restart   Échap: pause',W/2,H*.94);

  // Boutons coins
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.font='10px "Courier New"';ctx.textAlign='right';
  ctx.fillText('⚙ Parents',W-10,18);
  ctx.textAlign='left';ctx.fillText('⌨ Touches',10,18);
}

// ═══════════════════════════════════════════════════════════
// ÉCRANS OVERLAY (game over, pause, win, expired)
// ═══════════════════════════════════════════════════════════
function drawOverlay(title,sub,sub2){
  ctx.fillStyle='rgba(0,0,20,.75)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.shadowColor='#c8930a';ctx.shadowBlur=20;
  ctx.font=`bold ${Math.min(46,W/16)}px 'Pirata One',serif`;ctx.textAlign='center';
  ctx.fillText(title,W/2,H/2-24);ctx.shadowBlur=0;
  if(sub){ctx.fillStyle='#ffffc0';ctx.font=`${Math.min(18,W/44)}px "Courier New"`;ctx.fillText(sub,W/2,H/2+16);}
  if(sub2){ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='11px "Courier New"';ctx.fillText(sub2,W/2,H/2+40);}
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.font='10px "Courier New"';ctx.textAlign='right';ctx.fillText('⚙ Parents',W-10,18);
}
function drawTransition(){
  ctx.fillStyle=`rgba(0,0,0,${1-transP})`;ctx.fillRect(0,0,W,H);
  if(transP<.5){ctx.fillStyle=`rgba(255,215,0,${1-transP*2})`;ctx.font=`bold ${Math.min(42,W/18)}px 'Pirata One',serif`;ctx.textAlign='center';ctx.fillText(transName,W/2,H/2);}
}

// ═══════════════════════════════════════════════════════════
// RENDU JEU
// ═══════════════════════════════════════════════════════════
function renderGame(){
  if(!lvl)return;
  drawBackground(lvl.bgId);
  for(const p of lvl.platforms)drawPlatform(p);
  drawCollectibles();
  drawParticles(camX,camY);
  // Balles
  for(const b of bullets2){
    if(!b.alive)continue;
    ctx.save();const bg=ctx.createRadialGradient(b.x-camX,b.y-camY,0,b.x-camX,b.y-camY,6);
    bg.addColorStop(0,'#fff');bg.addColorStop(.4,'#ffd700');bg.addColorStop(1,'rgba(255,200,0,0)');
    ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(b.x-camX,b.y-camY,7,3,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  // Ennemis
  for(const e of enemies2){
    if(!e.alive)continue;
    ctx.save();ctx.translate(Math.round(e.x+e.w/2-camX),Math.round(e.y-camY));
    ctx.globalAlpha=e.dying?(e.dyingTimer/(e.t==='boss'?60:40)):1;
    if(e.t==='boss')drawBoss(ctx,e.walkCycle,e.facing,e.dying,e.dyingTimer,e.hp,e.maxHp);
    else if(e.t==='skeleton')drawSkeleton(ctx,e.walkCycle,e.facing,e.dying,e.dyingTimer);
    else drawPirate(ctx,e.walkCycle,e.facing,e.dying,e.dyingTimer);
    ctx.globalAlpha=1;
    // Barre de vie non-boss
    if(e.t!=='boss'&&!e.dying&&e.hp<e.maxHp){
      const bw=e.w+10,bx=e.x-e.w/2-5-camX,by=e.y-10-camY;
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(bx,by,bw,5);
      ctx.fillStyle='#e83030';ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),5);
    }
    ctx.restore();
  }
  // Joueur — Jack dessiné à 0.65 scale, origine = centre-haut de la hitbox
  // Son corps natif va de y=-40(chapeau) à y+51(pieds) = 91px * 0.65 = 59px
  // Hitbox h=52 → décalage vertical pour aligner les pieds
  if(player2){
    const blink=player2.invincible>0&&Math.floor(player2.invincible/5)%2===0;
    if(!blink){
      // On centre horizontalement sur la hitbox et on aligne les pieds
      const drawX = Math.round(player2.x + player2.w/2 - camX);
      const drawY = Math.round(player2.y + player2.h - camY); // pied de la hitbox
      // Jack natif: pieds à y=51 * 0.65 = 33px sous l'origine → on translate -33 pour aligner
      ctx.save();ctx.translate(drawX, drawY - 33);
      drawJack(ctx,player2.animState,player2.animFrame,player2.facing);
      // Arc épée
      if(player2.attacking){
        ctx.globalAlpha=.35;ctx.strokeStyle='#e0e0ff';ctx.lineWidth=2;
        const f=player2.facing;
        ctx.beginPath();ctx.arc(f>0?10:-10,0,22,f>0?-.8:Math.PI+.8,f>0?.8:Math.PI-.8);
        ctx.stroke();ctx.globalAlpha=1;
      }
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════════
// UPDATE CAMERA
// ═══════════════════════════════════════════════════════════
function updateCam(){
  if(!lvl||!player2)return;
  const tx=player2.x-W/3,ty=player2.y-H/2;
  camX+=(tx-camX)*.1;camY+=(ty-camY)*.08;
  camX=Math.max(0,Math.min(lvl.width-W,camX));
  camY=Math.max(0,Math.min(576-H,camY));
}

// ═══════════════════════════════════════════════════════════
// UPDATE GAME LOGIC
// ═══════════════════════════════════════════════════════════
function updateGame(){
  if(!lvl||!player2)return;
  updatePlayer(player2);
  resolveCol(player2,true);
  // Bullets
  for(let i=bullets2.length-1;i>=0;i--){
    const b=bullets2[i];b.x+=b.vx;b.y+=b.vy;
    if(b.x<-200||b.x>lvl.width+200){b.alive=false;}
    for(const p of lvl.platforms){if(p.t==='spike')continue;if(b.x+8>p.x&&b.x<p.x+p.w&&b.y+4>p.y&&b.y<p.y+p.h){b.alive=false;spawnParticles(b.x,b.y,'spark',4);break;}}
    if(!b.alive){bullets2.splice(i,1);continue;}
    for(const e of enemies2){
      if(!e.alive||e.dying)continue;
      if(b.x+8>e.x&&b.x<e.x+e.w&&b.y+4>e.y&&b.y<e.y+e.h){hitEnemy(e,1);score+=5;b.alive=false;break;}
    }
  }
  // Enemies
  for(const e of enemies2){updateEnemy(e,player2);if(!e.dying)resolveCol(e,false);}
  enemies2=enemies2.filter(e=>e.alive);
  // Sword hits
  const sw=playerSwordHitbox(player2);
  if(sw){for(const e of enemies2){if(!e.dying&&e.alive&&sw.x<e.x+e.w&&sw.x+sw.w>e.x&&sw.y<e.y+e.h&&sw.y+sw.h>e.y){hitEnemy(e,1);score+=5;}}}
  // Collectibles
  score+=checkCollectibles();
  updateParticles();
  updateCam();
  // Exit check
  const aliveEnemies=enemies2.filter(e=>!e.dying).length;
  if(player2.x+player2.w>lvl.exitX&&player2.x<lvl.exitX+200&&aliveEnemies===0){
    sfx('win');
    if(lvlIdx+1>=LEVELS.length)gs=GS.WIN;
    else loadLevel(lvlIdx+1);
  }
  // Game over
  if(player2.dead){setTimeout(()=>{if(gs===GS.PLAY)gs=GS.GAMEOVER;},1200);}
}

// ═══════════════════════════════════════════════════════════
// BOUCLE PRINCIPALE
// ═══════════════════════════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  // Resize only when needed (not every frame for perf)
  const newC=getActiveCanvas();
  if(newC!==C){C=newC;ctx=newC.getContext('2d');resize();}

  // Sur mobile : efface le canvas physique (512×288) puis scale 0.5
  // → tout le rendu logique 1024×576 tient dans 512×288 = zoom ×2
  if(mobileScale < 1){
    ctx.clearRect(0, 0, C.width, C.height);
    ctx.save();
    ctx.scale(mobileScale, mobileScale);
  } else {
    ctx.clearRect(0, 0, W, H);
  }

  switch(gs){
    case GS.TITLE:
      drawTitle();
      break;
    case GS.TRANS:
      if(lvl)renderGame();
      transP+=.025;drawTransition();
      if(transP>=1)gs=GS.PLAY;
      break;
    case GS.PLAY:
      updateGame();renderGame();drawHUD();drawGamepad();
      if(consumePause())gs=GS.PAUSE;
      if(consumeRestart()){loadLevel(lvlIdx);}
      // Mute
      if(keys['m']||keys['M']){muted=!muted;if(musicGain)musicGain.gain.value=muted?0:.25;keys['m']=false;keys['M']=false;}
      break;
    case GS.PAUSE:
      renderGame();
      drawOverlay('⚓ PAUSE','[Échap] Reprendre  [R] Restart');
      drawGamepad();
      { const _pr=consumePause(),_rr=consumeRestart();
        if(_rr){score=0;loadLevel(lvlIdx);}else if(_pr){gs=GS.PLAY;} }
      break;
    case GS.GAMEOVER:
      renderGame();drawOverlay('💀 GAME OVER 💀','[R] Recommencer');
      if(consumeRestart()){score=0;loadLevel(lvlIdx);}
      break;
    case GS.WIN:
      ctx.fillStyle='#020810';ctx.fillRect(0,0,W,H);
      drawOverlay('🏆 VICTOIRE !','Tu as conquis les 4 niveaux !','[R] Rejouer depuis le début');
      if(consumeRestart()){score=0;loadLevel(0);}
      break;
    case GS.EXPIRED:
      renderGame();
      ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ff4444';ctx.shadowColor='#ff0000';ctx.shadowBlur=14;
      ctx.font=`bold ${Math.min(34,W/22)}px 'Pirata One',serif`;ctx.textAlign='center';
      ctx.fillText('⏰ Temps de jeu terminé !',W/2,H/2-36);ctx.shadowBlur=0;
      ctx.fillStyle='#ffeecc';ctx.font=`${Math.min(15,W/52)}px "Courier New"`;
      ['Demande à tes parents pour continuer.','Menu ⚙ Parents → Activer du temps.'].forEach((l,i)=>ctx.fillText(l,W/2,H/2+6+i*26));
      break;
    case GS.KEYS:
      drawKeysScreen();
      break;
  }

  // Restaure le scale mobile après le rendu de la frame
  if(mobileScale < 1) ctx.restore();

  // Mute shortcut (M key) handled in PLAY state above
}

// ═══════════════════════════════════════════════════════════
// CLIC / TOUCH SUR CANVAS (PC + mobile GBC)
// ═══════════════════════════════════════════════════════════

function handleCanvasAction(canvasEl, clientX, clientY){
  const rect = canvasEl.getBoundingClientRect();
  // Convertit les coords CSS → coords logiques 1024×576
  // Sur mobile : canvas interne = 512×288 mais logique = 1024×576
  const x = (clientX - rect.left) * (GAME_W / rect.width);
  const y = (clientY - rect.top)  * (GAME_H / rect.height);
  if(gs === GS.TITLE){
    const b = titleBtn;
    if(x > b.x && x < b.x+b.w && y > b.y && y < b.y+b.h){
      if(!musicOk){startMusic();musicOk=true;}
      loadLevel(0);score=0;
      return;
    }
    if(x > W-90 && y < 30) showParents();
    if(x < 90  && y < 30) showKeysConfig();
  }
  if((gs===GS.PAUSE||gs===GS.EXPIRED) && x > W-90 && y < 30) showParents();
}

// Attache les listeners sur les DEUX canvas
[CPC, CGBC].forEach(cv => {
  cv.addEventListener('click', e => {
    handleCanvasAction(cv, e.clientX, e.clientY);
  });
  cv.addEventListener('touchend', e => {
    e.preventDefault();
    for(const t of e.changedTouches){
      handleCanvasAction(cv, t.clientX, t.clientY);
    }
  }, {passive:false});
});

// Bouton Start DOM → lancer le jeu depuis l'écran titre,
// ou mettre en pause pendant la partie
const _startEl = document.getElementById('btn-start');
if(_startEl){
  const _doStart = e => {
    e.preventDefault();
    if(gs === GS.TITLE){
      // Lance la partie
      if(!musicOk){startMusic();musicOk=true;}
      loadLevel(0);score=0;
    } else if(gs === GS.PLAY){
      inp.pausePressed = true;
    } else if(gs === GS.PAUSE){
      inp.pausePressed = true;
    } else if(gs === GS.GAMEOVER || gs === GS.WIN){
      inp.restartPressed = true;
    }
  };
  _startEl.addEventListener('touchstart', _doStart, {passive:false});
  _startEl.addEventListener('click', _doStart);
}

// Bouton Select DOM → restart dans tous les états
const _selEl = document.getElementById('btn-select');
if(_selEl){
  const _doSel = e => {
    e.preventDefault();
    if(gs === GS.TITLE){
      if(!musicOk){startMusic();musicOk=true;}
      loadLevel(0);score=0;
    } else {
      inp.restartPressed = true;
    }
  };
  _selEl.addEventListener('touchstart', _doSel, {passive:false});
  _selEl.addEventListener('click', _doSel);
}

// ═══════════════════════════════════════════════════════════
// PAGE CONFIGURATION TOUCHES (DOM overlay)
// ═══════════════════════════════════════════════════════════
const ACTION_LABELS={left:'Aller à gauche',right:'Aller à droite',jump:'Sauter',
  sword:'Attaque épée',gun:'Tir pistolet',pause:'Pause',restart:'Restart'};

function showKeysConfig(){
  inputBlocked=true;
  const ov=document.createElement('div');ov.className='overlay';
  const panel=document.createElement('div');panel.className='panel';
  panel.innerHTML=`<h2>⌨ Configuration des Touches</h2><p class="sub">Clique sur une touche puis appuie sur la nouvelle touche</p>`;
  const rows=document.createElement('div');rows.style.cssText='text-align:left;margin:12px 0';
  let listening=null;
  const boxes={};
  Object.entries(ACTION_LABELS).forEach(([action,label])=>{
    const row=document.createElement('div');row.className='key-row';
    const lbl=document.createElement('span');lbl.className='key-label';lbl.textContent=label;
    const box=document.createElement('span');box.className='key-box';
    box.textContent=keyConfig[action]===' '?'Espace':keyConfig[action];
    boxes[action]=box;
    box.addEventListener('click',()=>{
      if(listening){boxes[listening].classList.remove('listening');boxes[listening].textContent=keyConfig[listening]==='  '?'Espace':keyConfig[listening];}
      listening=action;box.classList.add('listening');box.textContent='Appuie sur une touche...';
    });
    row.appendChild(lbl);row.appendChild(box);rows.appendChild(row);
  });
  document.addEventListener('keydown',function kl(e){
    if(!listening)return;
    e.preventDefault();
    const key=e.key;
    keyConfig[listening]=key;saveKeys();
    boxes[listening].textContent=key===' '?'Espace':key;
    boxes[listening].classList.remove('listening');listening=null;
  },{once:false});
  panel.appendChild(rows);
  // Alt keys info
  const info=document.createElement('p');info.style.cssText='color:#888;font-size:.75em;margin:8px 0 14px';
  info.textContent='Note: Q/D/Z/Espace sont toujours actifs comme alternatives.';
  panel.appendChild(info);
  // Reset + Close
  const resetBtn=document.createElement('button');resetBtn.className='btn sec';resetBtn.textContent='↺ Réinitialiser';
  resetBtn.onclick=()=>{keyConfig={...DEFAULT_KEYS};saveKeys();Object.entries(ACTION_LABELS).forEach(([a])=>{boxes[a].textContent=keyConfig[a]===' '?'Espace':keyConfig[a];});};
  panel.appendChild(resetBtn);
  const closeBtn=document.createElement('button');closeBtn.className='btn sec';closeBtn.style.marginLeft='10px';closeBtn.textContent='✕ Fermer';
  closeBtn.onclick=()=>{inputBlocked=false;document.body.removeChild(ov);};
  panel.appendChild(closeBtn);
  ov.appendChild(panel);document.body.appendChild(ov);
}
function drawKeysScreen(){}// handled by DOM

// ═══════════════════════════════════════════════════════════
// MENU PARENTS (DOM overlay)
// ═══════════════════════════════════════════════════════════
function showParents(){
  inputBlocked=true;
  const ov=document.createElement('div');ov.className='overlay';
  const panel=document.createElement('div');panel.className='panel';
  let mul=genMul(),granted=false;
  function genMul(){const a=10+Math.floor(Math.random()*90),b=10+Math.floor(Math.random()*90);return{a,b,ans:a*b};}
  function render(){
    panel.innerHTML=`<h2>⚙ Menu Parents</h2><p class="sub">Prouve que tu es un adulte !</p>`;
    if(!granted){
      const qd=document.createElement('div');qd.style.cssText='background:rgba(255,255,255,.07);border-radius:8px;padding:16px;margin-bottom:14px';
      const qt=document.createElement('p');qt.style.cssText='font-size:1.8em;font-weight:bold;color:#ffeeaa;margin:0 0 12px';qt.textContent=`${mul.a} × ${mul.b} = ?`;
      const inp2=document.createElement('input');inp2.type='number';inp2.placeholder='Réponse...';
      const err=document.createElement('p');err.className='err-msg';
      qd.appendChild(qt);qd.appendChild(inp2);qd.appendChild(err);panel.appendChild(qd);
      const vb=document.createElement('button');vb.className='btn';vb.textContent='Valider ✓';
      vb.onclick=()=>{const v=parseInt(inp2.value,10);if(isNaN(v)){err.textContent='Entre un nombre entier.';return;}
        if(v===mul.ans){granted=true;render();}else{err.textContent='❌ Mauvaise réponse, réessayez.';mul=genMul();qt.textContent=`${mul.a} × ${mul.b} = ?`;inp2.value='';}};
      inp2.addEventListener('keydown',e=>{if(e.key==='Enter')vb.onclick();});
      panel.appendChild(vb);
    } else {
      const ok=document.createElement('p');ok.textContent='✅ Accès accordé !';ok.style.cssText='color:#88ff88;font-size:1.05em;margin:0 0 14px';panel.appendChild(ok);
      if(timerActive){const r=Math.floor(timerSecs/60),ss=timerSecs%60;const inf=document.createElement('p');inf.textContent=`⏱ Temps restant : ${r}:${ss.toString().padStart(2,'0')}`;inf.style.cssText='color:#88ff88;margin:0 0 12px';panel.appendChild(inf);}
      const tl=document.createElement('p');tl.textContent='Durée de jeu autorisée :';tl.style.cssText='margin:0 0 8px;color:#ffeeaa';panel.appendChild(tl);
      const sel=document.createElement('select');
      [5,10,15,20,30,45,60].forEach(m=>{const o=document.createElement('option');o.value=m*60;o.textContent=`${m} minute${m>1?'s':''}`;sel.appendChild(o);});
      panel.appendChild(sel);
      const ab=document.createElement('button');ab.className='btn';ab.style.cssText='display:block;width:100%;margin:10px 0 8px';
      ab.textContent=timerActive?'🔄 Réinitialiser':'▶ Activer le chrono';
      ab.onclick=()=>{
        const s=parseInt(sel.value,10);timerSecs=s;timerActive=true;saveTimer();
        if(timerInterval2)clearInterval(timerInterval2);
        timerInterval2=setInterval(tickTimer,1000);
        if(gs===GS.EXPIRED)gs=GS.PLAY;
        close();
      };panel.appendChild(ab);
      if(timerActive){const sb=document.createElement('button');sb.className='btn red';sb.style.cssText='display:block;width:100%;margin-bottom:10px';sb.textContent='⏹ Arrêter le chrono';sb.onclick=()=>{timerActive=false;timerSecs=0;if(timerInterval2){clearInterval(timerInterval2);timerInterval2=null;}saveTimer();close();};panel.appendChild(sb);}
    }
    const cb=document.createElement('button');cb.className='btn sec';cb.style.cssText='display:block;width:100%;margin-top:4px';cb.textContent='✕ Fermer';cb.onclick=close;panel.appendChild(cb);
  }
  function close(){inputBlocked=false;document.body.removeChild(ov);}
  render();ov.appendChild(panel);document.body.appendChild(ov);
}

// ═══════════════════════════════════════════════════════════
// LANCEMENT
// ═══════════════════════════════════════════════════════════
requestAnimationFrame(loop);
</script>
