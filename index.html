<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Jack Sparrow – Black Pearl ☠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a2e;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Courier New',monospace;}

/* ═══ PC ════════════════════════════════════════════════ */
#game-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
#game-wrap canvas{display:block;image-rendering:auto;box-shadow:0 0 60px rgba(200,147,10,.2),0 0 120px rgba(80,40,160,.15);}

/* ═══ MOBILE : émulateur vertical ══════════════════════ */
#gbc-shell{
  display:none;flex-direction:column;
  width:100vw;height:100dvh;max-width:480px;
  background:linear-gradient(180deg,#000 0%,#000 66%,#5020a0 66%,#7030c8 80%,#8844e0 100%);
  position:relative;overflow:hidden;
}
/* Haut : écran = 66% de la hauteur */
#gbc-top{
  background:#000;
  flex:0 0 66%;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 8px 0;
  min-height:0;
}
#screen-bezel{
  width:100%;flex:1;min-height:0;
  background:#060410;border-radius:8px;
  border:3px solid #1a1020;
  box-shadow:inset 0 0 24px rgba(0,0,0,.95),0 0 0 1px #222,0 4px 20px rgba(0,0,0,.9);
  overflow:hidden;position:relative;
  display:flex;align-items:stretch;
}
#screen-bezel::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);pointer-events:none;z-index:10;}
#screen-bezel canvas{width:100%!important;height:100%!important;display:block;image-rendering:auto;object-fit:contain;}
/* Barre milieu compacte */
#gbc-mid{background:#000;padding:2px 8px 4px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#gbc-brand{color:#5522aa;font-size:8px;letter-spacing:2px;text-transform:uppercase;opacity:.6;}
#gbc-leds{display:flex;gap:5px;align-items:center;}
.led{width:5px;height:5px;border-radius:50%;}
.led-green{background:#00ff44;box-shadow:0 0 4px #00ff44;}
.led-red{background:#ff3300;opacity:.22;}

/* Zone contrôles = tout le reste (~34%) */
#gbc-controls{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 12px;
}

/* D-PAD réduit pour tenir en 34% */
#dpad{width:90px;height:90px;position:relative;flex-shrink:0;}
#dpad-h2,#dpad-v2{
  position:absolute;
  background:linear-gradient(160deg,#1e1e1e,#0a0a0a);
  border-radius:7px;
  box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #333;
}
#dpad-h2{width:90px;height:30px;top:30px;left:0;}
#dpad-v2{width:30px;height:90px;top:0;left:30px;}
#dpad-center2{position:absolute;width:30px;height:30px;top:30px;left:30px;background:#111;border-radius:3px;z-index:3;}
.dp{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.35);font-size:9px;-webkit-tap-highlight-color:transparent;}
#dp-up{width:30px;height:30px;top:0;left:30px;}
#dp-dn{width:30px;height:30px;bottom:0;left:30px;}
#dp-lt{width:30px;height:30px;top:30px;left:0;}
#dp-rt{width:30px;height:30px;top:30px;right:0;}
.dp:active,.dp.active{background:rgba(255,255,255,.18);border-radius:4px;color:#fff;}

/* Boutons système compacts */
#sys-btns{display:flex;flex-direction:column;align-items:center;gap:5px;}
.sys2{
  background:linear-gradient(135deg,#2a1555,#18083a);
  border:1px solid #4a2888;border-radius:20px;
  color:#8855cc;font-size:7px;letter-spacing:1px;
  padding:4px 10px;cursor:pointer;text-transform:uppercase;
  box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.07);
  min-width:46px;text-align:center;-webkit-tap-highlight-color:transparent;
}
.sys2:active{background:#3a2060;color:#cc99ff;transform:translateY(1px);}

/* Boutons A/B adaptés à 34% */
#ab-zone{display:flex;flex-direction:column;align-items:flex-end;gap:0;flex-shrink:0;}
#ab-row{display:flex;align-items:center;gap:8px;}
.abtn{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:bold;color:rgba(255,255,255,.7);cursor:pointer;
  -webkit-tap-highlight-color:transparent;flex-shrink:0;position:relative;
  font-size:14px;letter-spacing:0;
}
.abtn::after{content:'';position:absolute;top:4px;left:6px;width:35%;height:22%;background:rgba(255,255,255,.2);border-radius:50%;transform:rotate(-20deg);}
.abtn:active,.abtn.active{filter:brightness(.75);transform:translateY(2px);}
#btn-b{
  width:46px;height:46px;
  background:radial-gradient(circle at 35% 30%,#252525,#080808);
  box-shadow:0 4px 0 #000,0 0 0 2px #2a2a2a;
  margin-top:10px;
}
#btn-a{
  width:46px;height:46px;
  background:radial-gradient(circle at 35% 30%,#252525,#080808);
  box-shadow:0 4px 0 #000,0 0 0 2px #2a2a2a;
}

/* Bas réduit */
#gbc-bottom2{
  background:linear-gradient(180deg,#7030c0,#4a1888);
  padding:3px 14px 6px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.speaker-line{display:flex;flex-direction:column;gap:2px;}
.sp-slot{width:22px;height:2px;background:rgba(0,0,0,.45);border-radius:2px;}
#bottom-brand{color:rgba(255,255,255,.22);font-size:6px;letter-spacing:2px;text-transform:uppercase;}

@media (max-width:700px),(max-height:560px){
  body{background:#000;}
  #game-wrap{display:none!important;}
  #gbc-shell{display:flex!important;}
}

/* ═══ Overlays DOM ══════════════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,20,.93);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Courier New',monospace}
.panel{background:linear-gradient(135deg,#1a0a30,#0d0820);border:2px solid #c8930a;border-radius:14px;padding:22px 26px;max-width:420px;width:92%;color:#ffd700;text-align:center;box-shadow:0 0 40px rgba(200,147,10,.3);max-height:90vh;overflow-y:auto;}
.panel h2{font-size:1.22em;margin-bottom:5px;font-family:'Pirata One',serif}
.panel p.sub{color:#aaa;font-size:.76em;margin-bottom:14px}
.panel input[type=number],.panel select{width:100%;padding:7px;font-size:.9em;font-family:inherit;background:#0d0820;border:2px solid #c8930a;border-radius:6px;color:#ffd700;text-align:center;outline:none;margin-bottom:8px}
.btn{background:#c8930a;color:#1a0a00;border:none;border-radius:7px;padding:8px 20px;font-size:.87em;font-weight:bold;cursor:pointer;font-family:inherit;}
.btn:hover{filter:brightness(1.15);}
.btn.sec{background:transparent;color:#aac;border:1px solid #aac;margin-top:6px}
.btn.red{background:transparent;color:#f88;border:1px solid #f88}
.key-row{display:flex;align-items:center;justify-content:space-between;padding:5px 2px;border-bottom:1px solid rgba(200,147,10,.18)}
.key-row:last-child{border-bottom:none}
.key-label{color:#ffeeaa;font-size:.84em;}
.key-box{background:#0d0820;border:2px solid #c8930a;border-radius:5px;padding:3px 10px;font-size:.78em;color:#ffd700;min-width:74px;cursor:pointer;}
.key-box.listening{border-color:#00ffaa;color:#00ffaa;animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.err-msg{color:#ff4444;font-size:.77em;min-height:13px;margin:2px 0 6px}
</style>
</head>
<body>

<!-- PC -->
<div id="game-wrap"><canvas id="C"></canvas></div>

<!-- Mobile GBC -->
<div id="gbc-shell">
  <div id="gbc-top">
    <div id="screen-bezel"><canvas id="C2"></canvas></div>
  </div>
  <div id="gbc-mid">
    <span id="gbc-brand">☠ Black Pearl</span>
    <div id="gbc-leds"><div class="led led-green"></div><div class="led led-red"></div></div>
  </div>
  <div id="gbc-controls">
    <div id="dpad">
      <div id="dpad-h2"></div><div id="dpad-v2"></div><div id="dpad-center2"></div>
      <div class="dp" id="dp-up">▲</div><div class="dp" id="dp-dn">▼</div>
      <div class="dp" id="dp-lt">◄</div><div class="dp" id="dp-rt">►</div>
    </div>
    <div id="sys-btns">
      <div class="sys2" id="btn-select">Select</div>
      <div class="sys2" id="btn-start">Start</div>
      <div class="sys2" id="btn-mute">🔊</div>
    </div>
    <div id="ab-zone">
      <div id="ab-row">
        <div class="abtn" id="btn-b">B</div>
        <div class="abtn" id="btn-a">A</div>
      </div>
    </div>
  </div>
  <div id="gbc-bottom2">
    <div class="speaker-line"><div class="sp-slot"></div><div class="sp-slot"></div><div class="sp-slot"></div></div>
    <span id="bottom-brand">Jack Sparrow</span>
    <div class="speaker-line"><div class="sp-slot"></div><div class="sp-slot"></div><div class="sp-slot"></div></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// JACK SPARROW – BLACK PEARL  v2.1.0  (fichier unique)
// ═══════════════════════════════════════════════════════════

// Canvas dual : PC (#C) et mobile GBC (#C2)
const CPC = document.getElementById('C');
const CGBC = document.getElementById('C2');
let C = CPC, ctx = CPC.getContext('2d');
let W = 1024, H = 576;
let mobileScale = 1; // 0.5 sur mobile, 1 sur PC

// Résolution logique du jeu : toujours 1024×576
const GAME_W = 1024, GAME_H = 576;

function getActiveCanvas(){
  return window.innerWidth<=700||window.innerHeight<=560 ? CGBC : CPC;
}

function resize(){
  const isMobile = window.innerWidth<=700||window.innerHeight<=560;
  if(isMobile){
    // Canvas interne = moitié → zoom ×2 visuel
    CGBC.width  = 512;
    CGBC.height = 288;
    C = CGBC; ctx = CGBC.getContext('2d');
    mobileScale = 0.5;
  } else {
    const r = GAME_W/GAME_H, ww=window.innerWidth, wh=window.innerHeight;
    if(ww/wh>r){CPC.height=Math.min(wh,GAME_H);CPC.width=Math.round(CPC.height*r);}
    else{CPC.width=Math.min(ww,GAME_W);CPC.height=Math.round(CPC.width/r);}
    CPC.style.width=CPC.width+'px';CPC.style.height=CPC.height+'px';
    C = CPC; ctx = CPC.getContext('2d');
    mobileScale = 1;
  }
  // W/H logiques restent toujours 1024×576 pour toute la logique de jeu
  W = GAME_W; H = GAME_H;
}
resize();
window.addEventListener('resize',resize);

// ═══════════════════════════════════════════════════════════
// CONFIG TOUCHES (persistante localStorage)
// ═══════════════════════════════════════════════════════════
const DEFAULT_KEYS={left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',
  sword:'e',gun:'p',pause:'Escape',restart:'r'};
const ALT_KEYS={left:'q',right:'d',jump:'z',jump2:' '};
let keyConfig={...DEFAULT_KEYS};
try{const s=localStorage.getItem('jspKeys');if(s)keyConfig={...DEFAULT_KEYS,...JSON.parse(s)};}catch(e){}
function saveKeys(){try{localStorage.setItem('jspKeys',JSON.stringify(keyConfig));}catch(e){}}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
const keys={};
const inp={left:false,right:false,jump:false,sword:false,gun:false,pause:false,restart:false,
  jumpPressed:false,swordPressed:false,gunPressed:false,pausePressed:false,restartPressed:false};
let inputBlocked=false;

function keyMatch(e,action){
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  const cfg=keyConfig[action];
  const cfgN=cfg&&cfg.length===1?cfg.toLowerCase():cfg;
  if(k===cfgN)return true;
  if(action==='left'&&k==='q')return true;
  if(action==='right'&&k==='d')return true;
  if(action==='jump'&&(k==='z'||k===' '))return true;
  return false;
}

document.addEventListener('keydown',e=>{
  if(inputBlocked)return;
  if(e.repeat)return;
  keys[e.key]=true;
  if(keyMatch(e,'left'))inp.left=true;
  if(keyMatch(e,'right'))inp.right=true;
  if(keyMatch(e,'jump')){inp.jump=true;inp.jumpPressed=true;}
  if(keyMatch(e,'sword')){inp.sword=true;inp.swordPressed=true;}
  if(keyMatch(e,'gun')){inp.gun=true;inp.gunPressed=true;}
  if(keyMatch(e,'pause')){inp.pause=true;inp.pausePressed=true;}
  if(keyMatch(e,'restart')){inp.restart=true;inp.restartPressed=true;}
  // Empêche scroll page
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(keyMatch(e,'left'))inp.left=false;
  if(keyMatch(e,'right'))inp.right=false;
  if(keyMatch(e,'jump'))inp.jump=false;
  if(keyMatch(e,'sword'))inp.sword=false;
  if(keyMatch(e,'gun'))inp.gun=false;
  if(keyMatch(e,'pause'))inp.pause=false;
  if(keyMatch(e,'restart'))inp.restart=false;
});

function consumeJump(){const v=inp.jumpPressed;inp.jumpPressed=false;return v;}
function consumeSword(){const v=inp.swordPressed;inp.swordPressed=false;return v;}
function consumeGun(){const v=inp.gunPressed;inp.gunPressed=false;return v;}
function consumePause(){const v=inp.pausePressed;inp.pausePressed=false;return v;}
function consumeRestart(){const v=inp.restartPressed;inp.restartPressed=false;return v;}

// ═══════════════════════════════════════════════════════════
// GBC DOM BUTTONS — wiring pour la coque mobile
// ═══════════════════════════════════════════════════════════
function wireGBCButtons(){
  // Helper: bind press/release sur un élément DOM
  function bind(id, onDown, onUp){
    const el=document.getElementById(id);
    if(!el)return;
    const dn=e=>{e.preventDefault();if(onDown)onDown();};
    const up=e=>{e.preventDefault();if(onUp)onUp();};
    el.addEventListener('touchstart',dn,{passive:false});
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('touchcancel',up,{passive:false});
    el.addEventListener('mousedown',dn);
    el.addEventListener('mouseup',up);
  }
  bind('dp-lt',
    ()=>{inp.left=true;},
    ()=>{inp.left=false;}
  );
  bind('dp-rt',
    ()=>{inp.right=true;},
    ()=>{inp.right=false;}
  );
  bind('dp-up',
    ()=>{inp.jump=true;inp.jumpPressed=true;},
    ()=>{inp.jump=false;}
  );
  bind('dp-dn',
    ()=>{},
    ()=>{}
  );
  bind('btn-a',
    ()=>{inp.sword=true;inp.swordPressed=true;},
    ()=>{inp.sword=false;}
  );
  bind('btn-b',
    ()=>{inp.gun=true;inp.gunPressed=true;},
    ()=>{inp.gun=false;}
  );
  // btn-start et btn-select sont gérés séparément après la boucle
  // (ils ont une logique contextuelle : lancer jeu sur titre, pause en jeu, etc.)
  const muteEl=document.getElementById('btn-mute');
  if(muteEl){
    muteEl.addEventListener('touchstart',e=>{e.preventDefault();muted=!muted;if(musicGain)musicGain.gain.value=muted?0:.25;muteEl.textContent=muted?'🔇':'🔊';},{passive:false});
    muteEl.addEventListener('click',()=>{muted=!muted;if(musicGain)musicGain.gain.value=muted?0:.25;muteEl.textContent=muted?'🔇':'🔊';});
  }
}
wireGBCButtons();

// ═══════════════════════════════════════════════════════════
// AUDIO (Web Audio API procédural)
// ═══════════════════════════════════════════════════════════
let audioCtx=null, musicGain=null, musicPlaying=false, musicNodes=[], musicTimer=null;
let muted=false;
const TEMPO=.35;

function getACtx(){
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function playNote(f,t,dur,type='triangle',vol=.12,a=.02,r=.1){
  const c=getACtx(),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);
  const rs=t+dur-r;g.gain.setValueAtTime(vol,Math.max(t+a,rs));
  g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+.01);
  musicNodes.push(o,g);
}
function playDrum(t,type='kick'){
  const c=getACtx(),buf=c.createBuffer(1,c.sampleRate*.3,c.sampleRate),d=buf.getChannelData(0);
  if(type==='kick'){for(let i=0;i<d.length;i++){const tt=i/c.sampleRate;d[i]=Math.sin(2*Math.PI*(120-80*tt)*tt)*Math.exp(-15*tt);}}
  else{for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-30*(i/c.sampleRate));}
  const s=c.createBufferSource(),g=c.createGain();
  s.buffer=buf;g.gain.value=type==='kick'?.35:.12;
  s.connect(g);g.connect(musicGain);s.start(t);musicNodes.push(s);
}
const MELODY=[[0,1],[3,.5],[5,.5],[7,1],[5,.5],[3,.5],[2,1],[0,.5],[-2,.5],[0,1.5],[null,.5],
  [5,1],[7,.5],[8,.5],[10,1],[8,.5],[7,.5],[5,1],[3,.5],[2,.5],[0,2]];
const ROOT=110;
function nf(s){return ROOT*Math.pow(2,s/12);}
function schedBar(bt){
  [0,2].forEach(b=>playDrum(bt+b*TEMPO,'kick'));
  [1,3].forEach(b=>playDrum(bt+b*TEMPO,'snare'));
  let t=bt;
  [[0,2],[-5,2],[0,2],[-5,2]].forEach(([s,d])=>{playNote(nf(s-12),t,d*TEMPO,'sawtooth',.07,.01,.05);t+=d*TEMPO;});
}
function schedMelody(bt){
  let t=bt;
  for(const [s,d] of MELODY){if(s!==null)playNote(nf(s+12),t,d*TEMPO,'triangle',.11);t+=d*TEMPO;}
}
let loopStart=0;
function musicLoop(){
  if(!musicPlaying)return;
  const barD=4*TEMPO;
  for(let i=0;i<2;i++)schedBar(loopStart+i*barD);
  schedMelody(loopStart);
  loopStart+=2*barD;
  musicTimer=setTimeout(musicLoop,barD*2000-150);
}
function startMusic(){
  if(musicPlaying)return;
  musicPlaying=true;
  const c=getACtx();
  musicGain=c.createGain();musicGain.gain.value=muted?0:.25;
  musicGain.connect(c.destination);
  loopStart=c.currentTime+.1;
  musicLoop();
}
function stopMusic(){
  musicPlaying=false;if(musicTimer)clearTimeout(musicTimer);
  musicNodes.forEach(n=>{try{n.stop?n.stop():n.disconnect();}catch(e){}});
  musicNodes=[];if(musicGain){musicGain.disconnect();musicGain=null;}
}
const sfxCD={};
function sfx(type){
  if(muted)return;
  const now=Date.now();if(sfxCD[type]&&now-sfxCD[type]<80)return;sfxCD[type]=now;
  const c=getACtx(),v=.5;
  if(type==='jump'){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(300,c.currentTime);o.frequency.exponentialRampToValueAtTime(600,c.currentTime+.15);g.gain.setValueAtTime(v*.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25);}
  else if(type==='sword'){const buf=c.createBuffer(1,c.sampleRate*.2,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++){const t=i/c.sampleRate;d[i]=(Math.random()*2-1)*Math.sin(2*Math.PI*800*t)*Math.exp(-20*t);}const s=c.createBufferSource(),g=c.createGain();s.buffer=buf;g.gain.value=v*.4;s.connect(g);g.connect(c.destination);s.start();}
  else if(type==='gun'){const buf=c.createBuffer(1,c.sampleRate*.3,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++){const t=i/c.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-25*t)*(1+Math.sin(2*Math.PI*60*t));}const s=c.createBufferSource(),g=c.createGain();s.buffer=buf;g.gain.value=v*.5;s.connect(g);g.connect(c.destination);s.start();}
  else if(type==='coin'){[880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;const t=c.currentTime+i*.08;g.gain.setValueAtTime(v*.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.3);});}
  else if(type==='hurt'){const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.value=180;g.gain.setValueAtTime(v*.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25);}
  else if(type==='death'){[300,200,100].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;const t=c.currentTime+i*.06;g.gain.setValueAtTime(v*.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.2);});}
  else if(type==='win'){[440,550,660,880].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;const t=c.currentTime+i*.12;g.gain.setValueAtTime(v*.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.4);});}
}

// ═══════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════
let particles=[];
function spawnParticles(x,y,type,count=8){
  for(let i=0;i<count;i++){
    const a=(Math.PI*2/count)*i+(Math.random()-.5)*.5,sp=1+Math.random()*3;
    const p={x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.025+Math.random()*.02,size:2+Math.random()*4,type};
    if(type==='coin'){p.color=`hsl(${45+Math.random()*15},100%,${50+Math.random()*20}%)`;p.vy-=3;p.decay=.015;p.size=3+Math.random()*5;}
    else if(type==='spark'){p.color=`hsl(${30+Math.random()*30},100%,70%)`;p.size=1.5+Math.random()*3;p.decay=.04;}
    else if(type==='smoke'){p.color=`rgba(180,180,180,${.35+Math.random()*.25})`;p.size=4+Math.random()*8;p.vx*=.3;p.vy=-1-Math.random();p.decay=.012;}
    else if(type==='land'){p.color=`rgba(${120+Math.random()*60},${80+Math.random()*40},40,.8)`;p.vy=-(1+Math.random()*2);p.vx=(Math.random()-.5)*4;p.decay=.035;}
    else if(type==='blood'){p.color=`rgba(${200+Math.random()*55},20,20,.9)`;p.decay=.025;}
    else if(type==='gold'){p.color=`hsl(45,100%,${55+Math.random()*20}%)`;p.vy-=2;p.decay=.018;}
    else if(type==='fire'){p.color=`hsl(${20+Math.random()*40},100%,${40+Math.random()*40}%)`;p.vy-=2+Math.random();p.size=3+Math.random()*6;p.decay=.02;}
    particles.push(p);
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.97;p.life-=p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(cx,cy){
  for(const p of particles){
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color||'#fff';
    if(p.type==='smoke'){ctx.beginPath();ctx.arc(p.x-cx,p.y-cy,p.size*(1.5-p.life),0,Math.PI*2);ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x-cx,p.y-cy,p.size,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}

// DESSIN JACK SPARROW — fidèle au sprite : chapeau tricorne brun-or,
// cheveux rouges longs, veste bleu-gris, pantalon sombre, bottes marron
// ═══════════════════════════════════════════════════════════
function drawJack(ctx2, state, frame, facing){
  // state: 'idle'|'walk'|'sword'|'gun'|'hurt'|'dead'|'jump'
  // SCALE DOWN pour matcher la taille des ennemis (~46px de haut)
  ctx2.save();
  ctx2.scale(0.65, 0.65); // Jack était ~90px total, ennemis ~46px → ratio ~0.65

  const t=Date.now()*.003;
  // Flip horizontal selon direction
  if(facing<0){ctx2.save();ctx2.scale(-1,1);}else{ctx2.save();}
  const wc=frame%4;
  const legA=[0,.28,0,-.28][wc]*Math.PI;
  const armSwing=state==='walk'?Math.sin(t*8)*.18:0;
  const breathY=state==='idle'?Math.sin(t*1.8)*1.2:0;
  const gunAng=state==='gun'?-.3:0;
  const swordAng=state==='sword'?(-.4+Math.sin(t*12)*.3):-.1;
  const hurtOff=state==='hurt'?4:0;
  const deadRot=state==='dead'?.8:0;
  if(state==='dead'){ctx2.rotate(deadRot);ctx2.translate(-8,12);}
  ctx2.translate(0,breathY+hurtOff);

  // === JAMBES ===

  ctx2.save();ctx2.translate(-6,29);ctx2.rotate(-legA*.8);
  // Pantalon bleu-gris foncé
  ctx2.fillStyle='#2e3545';
  ctx2.beginPath();ctx2.moveTo(-5,0);ctx2.lineTo(5,0);ctx2.lineTo(6,22);ctx2.lineTo(-6,22);ctx2.closePath();ctx2.fill();
  // Couture
  ctx2.strokeStyle='#1a2030';ctx2.lineWidth=1;ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,20);ctx2.stroke();
  // Botte marron
  ctx2.fillStyle='#5c2e00';ctx2.fillRect(-6,20,13,7);
  ctx2.fillStyle='#4a2300';ctx2.fillRect(-7,25,14,5);// semelle
  ctx2.restore();
  // Jambe avant
  ctx2.save();ctx2.translate(6,29);ctx2.rotate(legA);
  ctx2.fillStyle='#2e3545';
  ctx2.beginPath();ctx2.moveTo(-5,0);ctx2.lineTo(5,0);ctx2.lineTo(6,22);ctx2.lineTo(-6,22);ctx2.closePath();ctx2.fill();
  ctx2.strokeStyle='#1a2030';ctx2.lineWidth=1;ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,20);ctx2.stroke();
  ctx2.fillStyle='#6b3a00';ctx2.fillRect(-6,20,13,7);
  ctx2.fillStyle='#4a2300';ctx2.fillRect(-7,25,14,5);
  ctx2.restore();

  // === VESTE (corps) ===
  // Couleur : bleu-gris avec reflets
  const vestGrd=ctx2.createLinearGradient(-13,5,13,5);
  vestGrd.addColorStop(0,'#3d4a60');vestGrd.addColorStop(.5,'#4a5870');vestGrd.addColorStop(1,'#2e3848');
  ctx2.fillStyle=vestGrd;
  ctx2.beginPath();
  ctx2.moveTo(-13,5);ctx2.lineTo(13,5);ctx2.lineTo(14,32);ctx2.lineTo(-14,32);ctx2.closePath();
  ctx2.fill();
  ctx2.strokeStyle='#1a2535';ctx2.lineWidth=1.5;ctx2.stroke();
  // Chemise blanche visible (col)
  ctx2.fillStyle='#e8dcc8';
  ctx2.beginPath();ctx2.moveTo(-4,5);ctx2.lineTo(4,5);ctx2.lineTo(5,16);ctx2.lineTo(-5,16);ctx2.closePath();ctx2.fill();
  // Boutons dorés
  ctx2.fillStyle='#c8930a';
  [8,14,20].forEach(y=>{ctx2.beginPath();ctx2.arc(0,y,1.5,0,Math.PI*2);ctx2.fill();});
  // Ceinture
  ctx2.fillStyle='#3d2000';ctx2.fillRect(-14,28,28,5);
  ctx2.fillStyle='#c8930a';ctx2.beginPath();ctx2.arc(0,30.5,4,0,Math.PI*2);ctx2.fill();
  ctx2.fillStyle='#1a0d00';ctx2.beginPath();ctx2.arc(0,30.5,2,0,Math.PI*2);ctx2.fill();

  // === BRAS GAUCHE (arrière) ===
  ctx2.save();ctx2.translate(-13,8);ctx2.rotate(-armSwing-.1);
  ctx2.fillStyle='#3d4a60';ctx2.fillRect(-4,0,8,18);
  // Manchette blanche
  ctx2.fillStyle='#e8dcc8';ctx2.fillRect(-4,14,8,5);
  // Main
  ctx2.fillStyle='#c89060';ctx2.beginPath();ctx2.ellipse(0,20,4,3.5,0,0,Math.PI*2);ctx2.fill();
  ctx2.restore();

  // === BRAS DROIT (avant) avec arme ===
  ctx2.save();ctx2.translate(13,8);
  if(state==='gun'){ctx2.rotate(gunAng);}
  else{ctx2.rotate(armSwing+.1);}
  ctx2.fillStyle='#3d4a60';ctx2.fillRect(-4,0,8,18);
  ctx2.fillStyle='#e8dcc8';ctx2.fillRect(-4,14,8,5);
  ctx2.fillStyle='#c89060';ctx2.beginPath();ctx2.ellipse(0,20,4,3.5,0,0,Math.PI*2);ctx2.fill();

  if(state==='gun'||state==='idle'||state==='walk'||state==='jump'){
    // Pistolet
    ctx2.save();ctx2.translate(2,18);ctx2.rotate(gunAng?0:.15);
    ctx2.fillStyle='#1a1a1a';ctx2.fillRect(0,-3,22,5);// canon
    ctx2.fillStyle='#3d2a0a';// crosse bois
    ctx2.beginPath();ctx2.moveTo(2,2);ctx2.lineTo(8,2);ctx2.lineTo(10,12);ctx2.lineTo(3,12);ctx2.closePath();ctx2.fill();
    ctx2.fillStyle='#888';ctx2.fillRect(5,-4,3,4);// silex
    ctx2.restore();
  } else if(state==='sword'||true){
    // Épée (toujours visible sauf gun)
    if(state!=='gun'){
      ctx2.save();ctx2.translate(2,18);ctx2.rotate(swordAng);
      // Lame
      ctx2.strokeStyle='#c8d8e8';ctx2.lineWidth=3;
      ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,44);ctx2.stroke();
      ctx2.strokeStyle='#ffffff88';ctx2.lineWidth=1;
      ctx2.beginPath();ctx2.moveTo(-1,0);ctx2.lineTo(-1,40);ctx2.stroke();
      // Garde
      ctx2.fillStyle='#c8930a';ctx2.fillRect(-7,0,14,4);
      // Poignée
      ctx2.fillStyle='#5c2e00';ctx2.fillRect(-3,-8,6,10);
      // Pommeau
      ctx2.fillStyle='#c8930a';ctx2.beginPath();ctx2.arc(0,-8,4,0,Math.PI*2);ctx2.fill();
      ctx2.restore();
    }
  }
  ctx2.restore();

  // === TÊTE ===
  ctx2.save();ctx2.translate(0,-2);
  // Cou
  ctx2.fillStyle='#c89060';ctx2.fillRect(-4,0,8,9);
  // Visage
  const fgrd=ctx2.createRadialGradient(2,-8,1,-1,-8,12);
  fgrd.addColorStop(0,'#d4a070');fgrd.addColorStop(1,'#b87040');
  ctx2.fillStyle=fgrd;
  ctx2.beginPath();ctx2.ellipse(0,-9,11,13,0,0,Math.PI*2);ctx2.fill();
  ctx2.strokeStyle='#7a4020';ctx2.lineWidth=1.5;ctx2.stroke();

  // Sourcil droit incliné (air malicieux)
  ctx2.strokeStyle='#1a0800';ctx2.lineWidth=2;
  ctx2.beginPath();ctx2.moveTo(1,-17);ctx2.lineTo(8,-14);ctx2.stroke();
  ctx2.beginPath();ctx2.moveTo(-3,-16);ctx2.lineTo(2,-17);ctx2.stroke();

  // Oeil droit
  ctx2.fillStyle='#1a0800';ctx2.beginPath();ctx2.ellipse(4,-13,3,2.5,0,0,Math.PI*2);ctx2.fill();
  ctx2.fillStyle='white';ctx2.beginPath();ctx2.arc(5,-13.5,1,0,Math.PI*2);ctx2.fill();
  ctx2.fillStyle='#000';ctx2.beginPath();ctx2.arc(4.5,-13,1.2,0,Math.PI*2);ctx2.fill();
  // Khôl
  ctx2.strokeStyle='#1a0800';ctx2.lineWidth=1;
  ctx2.beginPath();ctx2.moveTo(1,-15.5);ctx2.lineTo(7.5,-14.5);ctx2.stroke();

  // Oeil gauche (partiellement caché)
  ctx2.fillStyle='#1a0800';ctx2.beginPath();ctx2.ellipse(-4,-13,2.5,2,0,0,Math.PI*2);ctx2.fill();

  // Nez
  ctx2.fillStyle='#a06040';ctx2.beginPath();ctx2.ellipse(2,-9,2.5,2,-.2,0,Math.PI*2);ctx2.fill();

  // Moustache fine
  ctx2.strokeStyle='#1a0800';ctx2.lineWidth=1.5;
  ctx2.beginPath();ctx2.moveTo(-6,-7);ctx2.quadraticCurveTo(0,-5,6,-7);ctx2.stroke();

  // Barbe noire longue
  ctx2.fillStyle='#0d0800';
  ctx2.beginPath();
  ctx2.moveTo(-9,-5);ctx2.quadraticCurveTo(-11,4,-8,14);
  ctx2.quadraticCurveTo(-4,18,0,16);ctx2.quadraticCurveTo(4,18,8,14);
  ctx2.quadraticCurveTo(11,4,9,-5);ctx2.quadraticCurveTo(4,-3,0,-2);ctx2.quadraticCurveTo(-4,-3,-9,-5);
  ctx2.fill();
  // Perles dans la barbe
  ctx2.fillStyle='#c8930a';
  ctx2.beginPath();ctx2.arc(-5,8,2,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(3,10,2,0,Math.PI*2);ctx2.fill();

  // === CHEVEUX ROUGES longs ===
  ctx2.fillStyle='#8b1a00';
  // Côté gauche (tresses)
  const hy=Math.sin(t*.8)*1.5;
  ctx2.beginPath();
  ctx2.moveTo(-10,-20);ctx2.bezierCurveTo(-18,-10+hy,-20,4+hy,-14,18+hy);
  ctx2.bezierCurveTo(-12,22+hy,-8,24+hy,-5,20);ctx2.bezierCurveTo(-6,14,-10,-8,-10,-20);
  ctx2.fill();
  // Tresse avant gauche
  ctx2.fillStyle='#6b1200';
  ctx2.beginPath();
  ctx2.moveTo(-8,-20);ctx2.bezierCurveTo(-14,-8+hy,-15,6+hy,-10,16+hy);
  ctx2.bezierCurveTo(-8,19+hy,-5,18,-4,14);ctx2.bezierCurveTo(-5,8,-8,-8,-8,-20);
  ctx2.fill();
  // Côté droit (quelques mèches)
  ctx2.fillStyle='#8b1a00';
  ctx2.beginPath();
  ctx2.moveTo(10,-20);ctx2.bezierCurveTo(14,-12+hy*.5,16,0+hy*.5,12,12+hy*.5);
  ctx2.bezierCurveTo(10,15,7,14,5,10);ctx2.bezierCurveTo(8,2,10,-12,10,-20);
  ctx2.fill();
  // Bandeau rouge sur le côté
  ctx2.fillStyle='#cc2200';
  ctx2.beginPath();ctx2.moveTo(-10,-20);ctx2.lineTo(-9,-22);ctx2.lineTo(10,-22);ctx2.lineTo(10,-20);
  ctx2.quadraticCurveTo(0,-18,-10,-20);ctx2.fill();

  // === CHAPEAU TRICORNE ===
  // Bord
  ctx2.fillStyle='#2a1a08';
  ctx2.beginPath();ctx2.ellipse(0,-24,17,5.5,0,0,Math.PI*2);ctx2.fill();
  // Corps principal
  const hatGrd=ctx2.createLinearGradient(-12,-38,12,-24);
  hatGrd.addColorStop(0,'#4a3010');hatGrd.addColorStop(.4,'#3a2208');hatGrd.addColorStop(1,'#2a1a05');

  ctx2.beginPath();
  ctx2.moveTo(-12,-24);ctx2.lineTo(-10,-40);ctx2.lineTo(10,-40);ctx2.lineTo(12,-24);ctx2.closePath();
  ctx2.fill();
  ctx2.strokeStyle='#1a0d00';ctx2.lineWidth=1.5;ctx2.stroke();
  // Bords relevés tricorne
  ctx2.fillStyle='#3a2208';
  ctx2.beginPath();ctx2.moveTo(-17,-24);ctx2.lineTo(-12,-30);ctx2.lineTo(-6,-27);ctx2.lineTo(-12,-24);ctx2.closePath();ctx2.fill();
  ctx2.beginPath();ctx2.moveTo(17,-24);ctx2.lineTo(12,-30);ctx2.lineTo(6,-27);ctx2.lineTo(12,-24);ctx2.closePath();ctx2.fill();
  // Liseré doré
  ctx2.strokeStyle='#c8930a';ctx2.lineWidth=1.8;
  ctx2.beginPath();ctx2.moveTo(-10,-40);ctx2.lineTo(-12,-24);ctx2.stroke();
  ctx2.beginPath();ctx2.moveTo(10,-40);ctx2.lineTo(12,-24);ctx2.stroke();
  ctx2.beginPath();ctx2.moveTo(-10,-40);ctx2.lineTo(10,-40);ctx2.stroke();
  ctx2.beginPath();ctx2.ellipse(0,-24,17,5.5,0,0,Math.PI*2);ctx2.stroke();
  // Reflet sur le chapeau
  ctx2.fillStyle='rgba(255,220,80,.1)';
  ctx2.beginPath();ctx2.ellipse(-3,-32,3.5,5.5,-.3,0,Math.PI*2);ctx2.fill();
  // Plume (décorative)

  for(let i=0;i<5;i++){

    ctx2.moveTo(10+i*.5,-38-i*2);ctx2.quadraticCurveTo(14+i,-41-i*2,12+i,-47-i*1.5);ctx2.stroke();
  }
  ctx2.restore();// fin flip/tête
  ctx2.restore();// fin flip horizontal
  ctx2.restore();// fin scale 0.65
}

function drawPirate(ctx2,frame,facing,dying,dyingT){

  ctx2.restore();
}

function drawSkeleton(ctx2,frame,facing,dying,dyingT){
  ctx2.save();if(facing<0)ctx2.scale(-1,1);
  const wc=frame%4,la=[0,.25,0,-.25][wc]*Math.PI;

  ctx2.strokeStyle='#d8e8d0';ctx2.lineWidth=4;

  ctx2.save();ctx2.translate(5,28);ctx2.rotate(-la);ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,18);ctx2.stroke();
  ctx2.fillStyle='#d8e8d0';ctx2.beginPath();ctx2.ellipse(0,18,5,3,0,0,Math.PI*2);ctx2.fill();ctx2.restore();
  // Colonne + côtes
  ctx2.beginPath();ctx2.moveTo(0,8);ctx2.lineTo(0,28);ctx2.stroke();

    ctx2.beginPath();ctx2.moveTo(0,ry);ctx2.bezierCurveTo(-8,ry+2,-10,ry+5,-7,ry+7);ctx2.stroke();
    ctx2.beginPath();ctx2.moveTo(0,ry);ctx2.bezierCurveTo(8,ry+2,10,ry+5,7,ry+7);ctx2.stroke();}
  // Bras
  const as=Math.sin(Date.now()*.006)*10;
  ctx2.save();ctx2.translate(-11,10);ctx2.rotate((-18+as)*Math.PI/180);ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,15);ctx2.stroke();ctx2.restore();
  ctx2.save();ctx2.translate(11,10);ctx2.rotate((15-as)*Math.PI/180);ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,15);ctx2.stroke();
  ctx2.strokeStyle='#b0c0b0';ctx2.lineWidth=2;ctx2.beginPath();ctx2.moveTo(0,14);ctx2.lineTo(0,32);ctx2.stroke();ctx2.restore();
  // Crâne
  ctx2.fillStyle='#d8e8d0';ctx2.beginPath();ctx2.ellipse(0,-1,11,12,0,0,Math.PI*2);ctx2.fill();
  ctx2.strokeStyle='#8aa898';ctx2.lineWidth=1;ctx2.stroke();
  ctx2.fillStyle='#111';ctx2.beginPath();ctx2.arc(-4,-.5,4,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(4,-.5,4,0,Math.PI*2);ctx2.fill();
  // Yeux rouges pulsants
  const p=.5+.5*Math.sin(Date.now()*.004);
  ctx2.fillStyle=`rgb(255,${Math.floor(20+p*25)},20)`;
  ctx2.shadowColor='#ff0000';ctx2.shadowBlur=8+p*5;
  ctx2.beginPath();ctx2.arc(-4,-.5,2.5,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(4,-.5,2.5,0,Math.PI*2);ctx2.fill();
  ctx2.shadowBlur=0;
  // Dents
  ctx2.fillStyle='#d8e8d0';
  for(let i=-3;i<=3;i+=2)ctx2.fillRect(i-.5,8,1.5,4);
  // Chapeau troué
  ctx2.fillStyle='#111';ctx2.beginPath();ctx2.ellipse(0,-12,13,3,0,0,Math.PI*2);ctx2.fill();
  ctx2.fillRect(-9,-12,18,12);
  ctx2.fillStyle='rgba(0,0,0,.5)';ctx2.beginPath();ctx2.ellipse(4,-7,4,5,.3,0,Math.PI*2);ctx2.fill();
  ctx2.restore();
}

function drawBoss(ctx2,frame,facing,dying,dyingT,hp,maxHp){
  ctx2.save();if(facing<0)ctx2.scale(-1,1);
  ctx2.globalAlpha*=dying?(dyingT/60):1;
  const t=Date.now()*.003,wc=frame%4,la=[0,.3,0,-.3][wc]*Math.PI;
  if(dying){ctx2.rotate(.5*(1-dyingT/60));ctx2.translate(0,20*(1-dyingT/60));}
  const S=1.7;ctx2.scale(S,S);// Boss plus grand
  // Manteau sombre
  ctx2.fillStyle='#150830';
  ctx2.beginPath();ctx2.moveTo(-16,5);ctx2.lineTo(16,5);
  ctx2.lineTo(18+Math.sin(t)*2,42);ctx2.lineTo(-18-Math.sin(t)*2,42);ctx2.closePath();ctx2.fill();
  ctx2.strokeStyle='#c8930a';ctx2.lineWidth=1.5;
  ctx2.beginPath();ctx2.moveTo(-2,5);ctx2.lineTo(-3,42);ctx2.stroke();
  // Jambes osseuses
  ctx2.strokeStyle='#c8d8c0';ctx2.lineWidth=4;
  ctx2.save();ctx2.translate(-7,40);ctx2.rotate(la);ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,18);ctx2.stroke();ctx2.restore();
  ctx2.save();ctx2.translate(7,40);ctx2.rotate(-la);ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,18);ctx2.stroke();ctx2.restore();
  // Bras + grande épée
  const as2=Math.sin(t)*8;
  ctx2.save();ctx2.translate(-13,8);ctx2.rotate((-20+as2)*Math.PI/180);
  ctx2.strokeStyle='#c8d8c0';ctx2.lineWidth=3;ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,16);ctx2.stroke();ctx2.restore();
  ctx2.save();ctx2.translate(13,8);ctx2.rotate((20-as2)*Math.PI/180);
  ctx2.strokeStyle='#c8d8c0';ctx2.lineWidth=3;ctx2.beginPath();ctx2.moveTo(0,0);ctx2.lineTo(0,16);ctx2.stroke();
  // Épée du boss
  ctx2.strokeStyle='#c0c8e0';ctx2.lineWidth=3;ctx2.beginPath();ctx2.moveTo(2,14);ctx2.lineTo(2,52);ctx2.stroke();
  ctx2.strokeStyle='#c8930a';ctx2.lineWidth=2;ctx2.beginPath();ctx2.moveTo(-7,18);ctx2.lineTo(11,18);ctx2.stroke();
  ctx2.restore();
  // Crâne boss (grand)
  ctx2.fillStyle='#c0c8b8';ctx2.beginPath();ctx2.ellipse(0,-2,14,16,0,0,Math.PI*2);ctx2.fill();
  ctx2.strokeStyle='#808880';ctx2.lineWidth=1.5;ctx2.stroke();
  // Couronne dorée
  ctx2.fillStyle='#c8930a';
  ctx2.beginPath();ctx2.moveTo(-13,-16);
  for(let i=0;i<5;i++){const bx=-13+i*6.5;ctx2.lineTo(bx,i%2===0?-16-11:-16-4);}
  ctx2.lineTo(13,-16);ctx2.closePath();ctx2.fill();
  // Gemmes couronne rouges
  [[-8,-26],[0,-30],[8,-26]].forEach(([gx,gy])=>{
    ctx2.fillStyle='#dd1010';ctx2.shadowColor='#ff0000';ctx2.shadowBlur=8;
    ctx2.beginPath();ctx2.arc(gx,gy,3.5,0,Math.PI*2);ctx2.fill();ctx2.shadowBlur=0;
  });
  // Orbites
  ctx2.fillStyle='#0a0808';ctx2.beginPath();ctx2.arc(-5,-3,5.5,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(5,-3,5.5,0,Math.PI*2);ctx2.fill();
  // Yeux rouges pulsants
  const bp=.5+.5*Math.sin(t*4);
  ctx2.fillStyle=`rgba(255,${Math.floor(10+bp*20)},10,1)`;
  ctx2.shadowColor='#ff0000';ctx2.shadowBlur=14+bp*8;
  ctx2.beginPath();ctx2.arc(-5,-3,3.5,0,Math.PI*2);ctx2.fill();
  ctx2.beginPath();ctx2.arc(5,-3,3.5,0,Math.PI*2);ctx2.fill();
  ctx2.shadowBlur=0;
  // Dents
  ctx2.fillStyle='#c0c8b8';
  for(let i=-4;i<=4;i+=2)ctx2.fillRect(i-.7,8,1.5,5);
  // Barbe squelette
  ctx2.strokeStyle='#c0c8b8';ctx2.lineWidth=1.5;
  for(let bx=-8;bx<=8;bx+=4){ctx2.beginPath();ctx2.moveTo(bx,13);ctx2.quadraticCurveTo(bx+1,20,bx,24);ctx2.stroke();}
  // Barre de vie boss (en dessous)
  ctx2.fillStyle='rgba(0,0,0,.5)';ctx2.fillRect(-20,70,40,6);
  ctx2.fillStyle=hp/maxHp>.5?'#44dd44':hp/maxHp>.25?'#ddaa11':'#dd2222';
  ctx2.fillRect(-20,70,40*(hp/maxHp),6);
  ctx2.strokeStyle='#888';ctx2.lineWidth=1;ctx2.strokeRect(-20,70,40,6);
  ctx2.restore();
}

// Timer parental
let timerSecs=0, timerActive=false, timerInterval2=null;
function loadTimer(){try{if(localStorage.getItem('jspTA')==='1'&&parseInt(localStorage.getItem('jspTS')||'0')>0){timerSecs=parseInt(localStorage.getItem('jspTS'));timerActive=true;timerInterval2=setInterval(tickTimer,1000);}}catch(e){}}
function saveTimer(){try{localStorage.setItem('jspTA',timerActive?'1':'0');localStorage.setItem('jspTS',timerSecs);}catch(e){}}
function tickTimer(){if(!timerActive)return;timerSecs--;saveTimer();if(timerSecs<=0){timerSecs=0;timerActive=false;clearInterval(timerInterval2);timerInterval2=null;if(gs===GS.PLAY)gs=GS.EXPIRED;}}

function createPlayer(x,y){
  return{x,y,w:32,h:52,vx:0,vy:0,onGround:false,jumpsLeft:2,facing:1,
    hp:5,maxHp:5,ammo:6,maxAmmo:6,
    swordCD:0,gunCD:0,attacking:false,attackTimer:0,
    invincible:0,dead:false,wasOnGround:false,
    animFrame:0,animTimer:0,animState:'idle',
    SPEED:4.5,JUMP:-12,GRAV:.5,MAXFALL:18,
  };
}

function updatePlayer(p){
  if(p.dead)return;
  // Movement
  if(inp.left){p.vx=-p.SPEED;p.facing=-1;}
  else if(inp.right){p.vx=p.SPEED;p.facing=1;}
  else p.vx*=.75;
  // Jump
  if(consumeJump()&&p.jumpsLeft>0){
    p.vy=p.JUMP*(p.jumpsLeft===1?.85:1);
    p.jumpsLeft--;
    sfx('jump');
    spawnParticles(p.x+p.w/2,p.y+p.h,'land',5);
  }
  // Gravity
  p.vy+=p.GRAV;if(p.vy>p.MAXFALL)p.vy=p.MAXFALL;
  p.x+=p.vx;p.y+=p.vy;
  // Timers
  if(p.swordCD>0)p.swordCD--;
  if(p.gunCD>0)p.gunCD--;
  if(p.invincible>0)p.invincible--;
  if(p.attackTimer>0){p.attackTimer--;p.attacking=p.attackTimer>0;}
  // Sword
  if(consumeSword()&&p.swordCD===0){
    p.attacking=true;p.attackTimer=18;p.swordCD=30;
    sfx('sword');
    spawnParticles(p.x+(p.facing>0?p.w+10:-10),p.y+20,'spark',6);
  }
  // Gun
  if(consumeGun()&&p.gunCD===0&&p.ammo>0){
    p.ammo--;p.gunCD=60;sfx('gun');
    spawnParticles(p.x+(p.facing>0?p.w:0),p.y+20,'smoke',4);
    bullets2.push({x:p.x+(p.facing>0?p.w+5:-5),y:p.y+22,vx:p.facing*14,vy:0,alive:true});
  }
  // Anim state
  if(Math.abs(p.vx)>.5&&p.onGround)p.animState='walk';
  else if(!p.onGround)p.animState='jump';
  else if(p.attacking)p.animState='sword';
  else if(p.gunCD>30)p.animState='gun';
  else p.animState='idle';
  p.animTimer++;
  if(Math.abs(p.vx)>.5&&p.onGround&&p.animTimer%8===0)p.animFrame++;
}

function playerSwordHitbox(p){
  if(!p.attacking)return null;
  return{x:p.facing>0?p.x+p.w:p.x-40,y:p.y+10,w:40,h:30};
}

function playerHit(p,dmg=1){
  if(p.invincible>0||p.dead)return;
  p.hp-=dmg;p.invincible=80;sfx('hurt');
  spawnParticles(p.x+p.w/2,p.y+p.h/2,'blood',10);
  p.vx=-p.facing*3;p.vy=-4;
  if(p.hp<=0){p.hp=0;p.dead=true;}
}

function createEnemy(x,y,type){
  const e={x,y,t:type,w:30,h:48,vx:0,vy:0,onGround:false,facing:-1,
    alive:true,dying:false,dyingTimer:0,
    hp:type==='boss'?14:2,maxHp:type==='boss'?14:2,
    speed:type==='boss'?1.8:type==='skeleton'?2.2:1.8,
    dmg:type==='boss'?2:1,
    detR:type==='boss'?600:280,atkR:type==='boss'?60:40,
    atkCD:0,walkCycle:0,walkTimer:0,
    patrolStart:x-80,patrolEnd:x+80,patrolDir:1,
  };
  if(type==='boss'){e.w=56;e.h=76;}
  return e;
}

function updateEnemy(e,p){
  if(!e.alive)return;
  if(e.dying){e.dyingTimer--;e.vy+=.5;e.y+=e.vy;if(e.dyingTimer<=0)e.alive=false;return;}
  const dx=p.x+p.w/2-(e.x+e.w/2);
  const dy=p.y+p.h/2-(e.y+e.h/2); // distance verticale centre à centre
  const distH=Math.abs(dx);   // distance horizontale
  const distV=Math.abs(dy);   // distance verticale
  // Seuil vertical : si Jack est plus de 80px plus haut (ou plus bas), l'ennemi
  // ne peut ni le poursuivre ni l'attaquer (il est sur une autre plateforme)
  const sameLevel = distV < 80;

  if(distH<e.detR && sameLevel && !p.dead){
    e.facing=dx>0?1:-1;e.vx=e.facing*e.speed;
    // Jump over walls (seulement si même plan)
    if(e.onGround&&Math.abs(e.vx)>.5){
      const tx=e.x+(e.facing>0?e.w+2:-2);
      for(const pl of lvl.platforms){
        if(pl.t==='spike')continue;
        if(tx>pl.x&&tx<pl.x+pl.w&&e.y+e.h>pl.y&&e.y+e.h-10<pl.y+pl.h){e.vy=-9;break;}
      }
    }
    // Attaque seulement si même niveau ET à portée horizontale
    if(distH<e.atkR && distV<40){
      e.vx=0;
      if(e.atkCD===0){e.atkCD=90;playerHit(p,e.dmg);}
    }
  } else {
    // Patrouille si Jack hors portée ou sur une autre plateforme
    e.vx=e.patrolDir*e.speed*.6;
    if(e.x>e.patrolEnd||e.x<e.patrolStart){e.patrolDir*=-1;e.facing=e.patrolDir;}
  }
  if(e.atkCD>0)e.atkCD--;
  e.vy+=.5;if(e.vy>18)e.vy=18;
  e.x+=e.vx;e.y+=e.vy;
  e.walkTimer++;
  if(Math.abs(e.vx)>.2&&e.onGround&&e.walkTimer%10===0)e.walkCycle++;
}

function hitEnemy(e,dmg=1){
  if(e.dying||!e.alive)return;
  e.hp-=dmg;
  spawnParticles(e.x+e.w/2,e.y+e.h/2,'blood',6);
  if(e.hp<=0){
    e.hp=0;e.dying=true;e.dyingTimer=e.t==='boss'?60:40;
    sfx('death');spawnParticles(e.x+e.w/2,e.y+e.h/2,'gold',14);
  }
}

// ═══════════════════════════════════════════════════════════
// COLLISION RÉSOLUTION
// ═══════════════════════════════════════════════════════════
function resolveCol(ent,isPlayer){
  ent.onGround=false;
  for(const p of lvl.platforms){
    if(p.t==='spike')continue;
    const el=ent.x,er=ent.x+ent.w,et=ent.y,eb=ent.y+ent.h;
    const pl=p.x,pr=p.x+p.w,pt=p.y,pb=p.y+p.h;
    if(er>pl&&el<pr&&eb>pt&&et<pb){
      const oL=er-pl,oR=pr-el,oT=eb-pt,oB=pb-et;
      const m=Math.min(oL,oR,oT,oB);
      if(m===oT&&ent.vy>=0){
        ent.y=pt-ent.h;ent.vy=0;ent.onGround=true;
        if(isPlayer){
          if(!ent.wasOnGround)spawnParticles(ent.x+ent.w/2,ent.y+ent.h,'land',4);
          ent.jumpsLeft=2;
        }
      } else if(m===oB&&ent.vy<0){ent.y=pb;ent.vy=0;}
      else if(m===oL){ent.x=pl-ent.w;ent.vx=0;}
      else if(m===oR){ent.x=pr;ent.vx=0;}
    }
  }
  ent.wasOnGround=ent.onGround;
  // Spikes
  for(const p of lvl.platforms){
    if(p.t!=='spike')continue;
    if(ent.x+ent.w>p.x&&ent.x<p.x+p.w&&ent.y+ent.h>p.y-16&&ent.y<p.y){
      if(isPlayer)playerHit(ent,2); else if(ent.dying===false)hitEnemy(ent,10);
    }
  }
  // Bounds
  if(ent.y+ent.h>lvl.height+60){if(isPlayer)playerHit(ent,5);ent.y=-80;ent.vy=0;}
  if(ent.x<0){ent.x=0;ent.vx=0;}
  if(ent.x+ent.w>lvl.width){ent.x=lvl.width-ent.w;ent.vx=0;}
}

function loadLevel(idx){
  lvlIdx=idx;lvl=JSON.parse(JSON.stringify(LEVELS[idx]));
  particles=[];bullets2=[];
  player2=createPlayer(lvl.playerStart.x,lvl.playerStart.y);
  window._player=player2;
  enemies2=lvl.enemies.map(e=>createEnemy(e.x,e.y,e.t));
  // Boss
  if(lvl.boss){
    const b=createEnemy(lvl.boss.x,lvl.boss.y,'boss');
    b.hp=lvl.boss.hp;b.maxHp=lvl.boss.maxHp;
    enemies2.push(b);
  }
  // Collectibles
  collectibles2=[
    ...lvl.coins.map(c=>({...c,type:'coin',collected:false})),
    ...lvl.ammos.map(a=>({...a,type:'ammo',collected:false})),
  ];
  camX=0;camY=0;
  transName=lvl.name;transP=0;gs=GS.TRANS;
}
